# The hosted site: the Cloudflare Worker "debrief" at https://debriefme.io (Oct 20). www.debriefme.io and the old address,
# https://debrief.james-m-nemecek.workers.dev, still reach it and send visitors on to debriefme.io (see moveHome in the Worker).
# Build first (src/build.ps1 writes online/worker.js), then upload with: npx wrangler deploy
# The Warcraft Logs key is NOT here: it's in the Worker's secrets (WCL_CLIENT_ID, WCL_CLIENT_SECRET), set in Cloudflare.
name = "debrief"
main = "online/worker.js"
compatibility_date = "2026-09-01"
workers_dev = true
# (practice links on (your OK, Oct 20): `npx wrangler versions upload --preview-alias <name>` gives a practice copy at
# https://<name>-debrief.james-m-nemecek.workers.dev to try before it goes live; deploying keeps them on)
preview_urls = true
# (keep what's set on the Cloudflare settings page: an upload must never remove the Warcraft Logs client ID)
keep_vars = true
# Debrief's own address (bought on Cloudflare, Oct 20): Cloudflare makes the DNS records and the padlock for these itself.
routes = [
  { pattern = "debriefme.io", custom_domain = true },
  { pattern = "www.debriefme.io", custom_domain = true },
]

# Patch notes to Discord: every 10 minutes the Worker checks for a new Patch notes day and posts it to #patch-notes
# (needs the DISCORD_PATCH_WEBHOOK secret, set in Cloudflare). DEBRIEF_KV remembers the last day announced.
[triggers]
crons = ["*/10 * * * *"] # (the one-minute run and every Discord job belong to the Discord helper's own Worker now: wrangler.bot.toml)

# The Discord bot (the instant @Claudette listener and every Discord job) lives in its own Worker, "debrief-discord" (wrangler.bot.toml, Oct 26):
# Cloudflare makes no practice links for a Worker that has a Durable Object. This Worker passes Discord's calls on to it (BOT), and hands it the
# bot's keys inside Cloudflare (BotKeys in the Worker), so no key is copied or typed anywhere.
[[services]]
binding = "BOT"
service = "debrief-discord"

# (Oct 26 move) the listener class used to live here; gateway-2 removes it. It needs `npx wrangler deploy` (a versions upload can't apply
# migrations). Once it has been applied, both blocks can be deleted.
[[migrations]]
tag = "gateway-1"
new_sqlite_classes = ["DiscordGateway"]

[[migrations]]
tag = "gateway-2"
deleted_classes = ["DiscordGateway"]

# Raid nights kept once for everyone (Oct 26): each pull's event pages and death lists, gzipped (see R2_ROUTES in src/worker_template.js)
[[r2_buckets]]
binding = "debrief_nights"
bucket_name = "debrief-nights"

[[kv_namespaces]]
binding = "DEBRIEF_KV"
id = "5f5a92a1ea294fb888dea9dc5d7a2aa8"

# Plain files served as they are, before the Worker: og.png is the picture on Debrief link previews (Discord and others).
[assets]
directory = "./site-assets"

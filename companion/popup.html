<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Debrief recap</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* The recap pop-up (Oct 22): the in-game card's coach box, floating over WoW right after a pull, without taking focus.
   Debriefing's own coach box, word for word. */
:root { --bg: #171a22; --raised: #1e222c; --line: #2a2f3b; --line2: #353b49; --text: #ece8df; --muted: #98a0ad; --faint: #6c7381; --soft: #d6d1c6;
  --gold: #e6b450; --gold-ink: #1b1406; --em: #5fdc7a; --good: #45c15c; --goodT: #7ee08f; --bad: #e5534b; --badT: #ff8f87; --warn: #e8a23a; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 Barlow, 'Segoe UI', system-ui, sans-serif; overflow: hidden; }
body { border: 1px solid var(--line2); border-radius: 10px; }
.wrap { display: flex; flex-direction: column; max-height: 100vh; }
.top { display: flex; align-items: center; gap: 8px; padding: 10px 10px 9px 14px; border-bottom: 1px solid var(--line); app-region: drag; -webkit-app-region: drag; cursor: move; flex: none; }
.top svg { width: 17px; height: 19px; flex: none; }
.top b { font: 700 16px 'Barlow Semi Condensed', Barlow, sans-serif; }
.top .bt { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.top .pill { margin-left: auto; font: 700 12px Barlow, sans-serif; border-radius: 5px; padding: 2px 9px; background: #3a1d1d; color: var(--badT); white-space: nowrap; }
.top .pill.k { background: #17301e; color: var(--goodT); }
.x { app-region: no-drag; -webkit-app-region: no-drag; background: none; border: 0; color: var(--faint); font-size: 15px; width: 26px; height: 26px; border-radius: 5px; cursor: pointer; flex: none; }
.x:hover { color: var(--text); background: var(--raised); }
.body { padding: 12px 14px 4px; overflow: auto; flex: 1; min-height: 0; }
.body::-webkit-scrollbar { width: 8px; } .body::-webkit-scrollbar-thumb { background: #2f3542; border-radius: 4px; }
.cl { color: var(--gold); font: 700 11.5px/1 Barlow, sans-serif; letter-spacing: .05em; margin: 2px 0 8px; } .cl.mut { color: var(--muted); margin-top: 6px; }

.cfoc { background: rgba(230,180,80,.08); border: 1px solid rgba(230,180,80,.55); border-radius: 6px; padding: 10px 14px 11px; margin-bottom: 12px; }

.cw { display: flex; gap: 10px; background: var(--raised); border: 1px solid var(--line); border-left: 3px solid var(--warn); border-radius: 6px; padding: 10px 12px 10px 9px; margin-bottom: 8px; } .cw.bad { border-left-color: var(--bad); }

.cwb { flex: 1; min-width: 0; } .cwt { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; } .cwt b { font: 600 14px/1.3 Barlow, sans-serif; }
.tg { font: 700 11.5px Barlow, sans-serif; color: var(--warn); } .cw.bad .tg { color: var(--badT); }
.cwh { color: var(--muted); font: 13px/1.4 Barlow, sans-serif; margin: 5px 0; }
.cfx { display: flex; gap: 10px; font: 13.5px/1.4 Barlow, sans-serif; color: var(--soft); margin-top: 5px; } .cfx span:first-child { flex: 0 0 70px; white-space: nowrap; color: var(--gold); font: 700 11.5px/1.6 Barlow, sans-serif; letter-spacing: .04em; }
.cok { display: flex; gap: 8px; color: var(--goodT); font: 13.5px/1.4 Barlow, sans-serif; margin: 4px 0 6px; } .cok span { color: var(--good); font-weight: 700; }
.more { color: var(--faint); font-size: 12.5px; margin: 0 0 8px; }
.cfd { background: var(--raised); border: 1px solid var(--line); border-radius: 6px; margin-top: 8px; padding: 0 12px; }
.cfh { display: flex; justify-content: space-between; color: var(--muted); font: 700 12px/32px Barlow, sans-serif; letter-spacing: .04em; cursor: pointer; user-select: none; } .cfh:hover { color: var(--gold); }
.cr { display: flex; align-items: center; gap: 8px; font: 13.5px/26px Barlow, sans-serif; color: var(--soft); cursor: default; } .cr.has { cursor: pointer; } .cr.has:hover { color: var(--text); }
.cr .t { color: var(--faint); width: 30px; flex: none; } .cr i { width: 8px; height: 8px; border-radius: 50%; flex: none; } .cr b { font-weight: 600; white-space: nowrap; }
.cr .ab { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.cst { margin: 0 0 8px 24px; color: var(--muted); font: 13px/1.4 Barlow, sans-serif; }
.cnt { color: var(--faint); font: 12px/1.4 Barlow, sans-serif; margin: 4px 0 8px; }
.ic { width: 20px; height: 20px; border-radius: 3px; background: #262b36; border: 1px solid #000; flex: none; display: inline-block; vertical-align: middle; overflow: hidden; }
.ic img { width: 100%; height: 100%; display: block; transform: scale(1.1); }
.foot { display: flex; align-items: center; gap: 10px; padding: 10px 14px 12px; border-top: 1px solid var(--line); flex: none; }
.btn { background: var(--gold); color: var(--gold-ink); border: 1px solid var(--gold); border-radius: 7px; padding: 7px 14px; font: 600 13.5px Barlow, sans-serif; cursor: pointer; white-space: nowrap; }
.btn:hover { background: #efc265; }
.btn.done { background: #17301e; border-color: #2b5a36; color: var(--goodT); cursor: default; }

.body.sitebody { padding: 10px 10px 4px; }
/* tonight's pulls, one chip each: red for a wipe (with how much was left), green for a kill, a gold edge on the best */
.pulls { display: flex; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--line); overflow-x: auto; flex: none; scrollbar-width: thin; }
.pulls::-webkit-scrollbar { height: 6px; } .pulls::-webkit-scrollbar-thumb { background: #2f3542; border-radius: 3px; }
.pc { flex: none; padding: 3px 9px; border-radius: 5px; border: 1px solid transparent; background: #3a1d1d; color: var(--badT); font: 600 12px Barlow, sans-serif; cursor: pointer; white-space: nowrap; }
.pc.k { background: #17301e; color: var(--goodT); }

.pb { flex: none; align-self: center; font: 700 10.5px Barlow, sans-serif; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); padding: 0 2px 0 6px; white-space: nowrap; }
.pb:first-child { padding-left: 0; }
/* Stop at death, over the coach box (the same filter as the website and the card) */
.stp { display: flex; align-items: center; justify-content: space-between; background: var(--raised); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; margin: 0 0 4px; }
.stp b { font: 700 13px Barlow, sans-serif; }
.stpc { display: flex; align-items: center; gap: 4px; }
.stpc button { width: 24px; height: 22px; border-radius: 5px; border: 0; background: var(--bg); color: var(--muted); font: 700 13px Barlow, sans-serif; cursor: pointer; }
.stpc button:hover { color: var(--gold); }
.stpc em { font-style: normal; width: 32px; text-align: center; font: 700 13px Barlow, sans-serif; }
.stpn { margin: 0 2px 10px; color: var(--faint); font-size: 12px; }
.stp { margin: 0 0 10px; } .stpt { border: 1px solid var(--line); background: var(--bg); color: var(--muted); font: 700 12px Barlow, sans-serif; border-radius: 6px; padding: 3px 12px; cursor: pointer; } .stpt.on { background: #e6b450; border-color: #e6b450; color: #161a25; } .stpi { font: 400 12.5px Barlow, sans-serif; font-style: normal; color: var(--faint); margin-left: 8px; }
/* the slim bar a pull opens with: one click for the whole card */
body.isMini { border-color: rgba(230,180,80,.85); box-shadow: inset 0 0 0 1px rgba(230,180,80,.25); background: linear-gradient(90deg, rgba(230,180,80,.16), rgba(230,180,80,.04) 60%), var(--bg); }
.mini { display: flex; align-items: center; gap: 12px; padding: 13px 12px 13px 16px; app-region: drag; -webkit-app-region: drag; cursor: move; animation: slideIn .45s cubic-bezier(.2,.8,.2,1) both; }
@keyframes slideIn { from { transform: translateX(36px); opacity: 0; } to { transform: none; opacity: 1; } }
.mini svg { width: 28px; height: 31px; flex: none; filter: drop-shadow(0 0 8px rgba(230,180,80,.45)); }
.mini .btn { font-size: 15px; padding: 9px 18px; box-shadow: 0 0 0 0 rgba(230,180,80,.6); animation: nudge 1.6s ease-out .5s 4; }
@keyframes nudge { 0% { box-shadow: 0 0 0 0 rgba(230,180,80,.65); } 70% { box-shadow: 0 0 0 12px rgba(230,180,80,0); } 100% { box-shadow: 0 0 0 0 rgba(230,180,80,0); } }
.mini .mt { min-width: 0; flex: 1; }
.mini .m1 { font: 700 17px/1.2 'Barlow Semi Condensed', Barlow, sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini .m2 em { font-style: normal; font-weight: 600; color: var(--badT); } .mini .m2 em.k { color: var(--goodT); }
.mini .m2 { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini .btn, .mini .x { app-region: no-drag; -webkit-app-region: no-drag; }
/* the /recap card in the pop-up (Oct 24): the addon's look, two columns when the window is wide */
.ktabs { display: flex; gap: 18px; border-bottom: 1px solid var(--line); margin: 2px 0 12px; font-weight: 600; color: var(--muted); }
.ktabs span { padding: 4px 0 6px; cursor: pointer; } .ktabs span.on { color: var(--text); box-shadow: inset 0 -2px 0 var(--gold); } .ktabs em { font-style: normal; color: var(--faint); font-weight: 500; font-size: 12.5px; }
.kgrid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0 22px; align-items: start; }
@media (min-width: 860px) { .kgrid { grid-template-columns: minmax(0, 1.08fr) minmax(0, 1fr); } .kgrid.one { grid-template-columns: minmax(0, 1fr); } }
.kL, .kR { min-width: 0; }
.kl { color: var(--gold); font: 700 11.5px/1 Barlow, sans-serif; letter-spacing: .05em; margin: 2px 0 7px; } .kl.mut { color: var(--muted); margin-top: 12px; }
.khd { font: 600 16.5px/1.35 'Barlow Semi Condensed', Barlow, sans-serif; margin: 0 0 12px; }
.kc { background: var(--raised); border: 1px solid var(--line); border-radius: 8px; margin: 0 0 10px; }
.kh { display: flex; align-items: center; gap: 8px; padding: 9px 12px; cursor: pointer; user-select: none; } .kh b { font: 700 14.5px 'Barlow Semi Condensed', Barlow, sans-serif; } .kh i { margin-left: auto; color: var(--faint); font-style: normal; font-weight: 700; } .kh:hover b, .kh:hover i { color: var(--gold); }
.kb { padding: 0 12px 8px; }
.ksc { color: var(--muted); font: 600 12.5px Barlow, sans-serif; } .ksc b { color: var(--goodT); }
.kr { display: grid; grid-template-columns: 10px 22px minmax(0, 1fr); gap: 0 9px; align-items: start; font-size: 13.5px; color: var(--soft); padding: 4px 0; }
.kd { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; display: inline-block; flex: none; }
.kmore { color: var(--muted); font-size: 12.5px; padding: 4px 0 2px 41px; cursor: pointer; } .kmore:hover { color: var(--gold); }
.kmore0 { color: var(--faint); font-size: 12.5px; margin: 2px 0 6px 4px; }
.knm { font-weight: 600; }
.kyou { background: rgba(230,180,80,.07); border: 1px solid rgba(230,180,80,.5); border-radius: 8px; padding: 10px 14px; margin: 0 0 10px; }
.kv { margin: 0 0 9px; color: var(--soft); font-size: 14px; } .ktips { margin: 0; padding-left: 20px; font-weight: 600; font-size: 14px; } .ktips li { margin: 2px 0; } .ktip1 { margin: 0; font-weight: 600; font-size: 14px; }
.ktr { margin-top: 8px; font-size: 13px; color: var(--soft); } .ktr p { margin: 3px 0; }
.ktiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 0 0 10px; }
.kt { background: var(--raised); border: 1px solid var(--line); border-radius: 8px; padding: 8px 11px; } .kt small { display: block; color: var(--muted); font-size: 12px; } .kt b { display: block; font: 700 20px Barlow, sans-serif; } .kt b em { font-style: normal; font-size: 12px; color: var(--muted); } .kt i { font-style: normal; color: var(--faint); font-size: 12px; }
.kt.w b { color: var(--warn); } .kt.b b { color: var(--badT); }
.krr { display: grid; grid-template-columns: 10px 22px minmax(0, 1fr); gap: 0 9px; align-items: start; padding: 6px 0; border-top: 1px solid rgba(255,255,255,.04); } .krr:first-child { border-top: 0; }
.krt { display: flex; gap: 10px; align-items: baseline; } .krt b { font-size: 13.5px; } .krv { margin-left: auto; font-weight: 700; font-size: 13.5px; white-space: nowrap; } .krv small { color: var(--faint); font-weight: 600; margin-left: 6px; }
.ksq { display: flex; flex-wrap: wrap; gap: 2px; margin: 5px 0 2px; } .ksq i { width: 8px; height: 8px; display: block; }
.knx { margin: 3px 0 0; font-size: 12.5px; color: var(--soft); } .knx b { color: var(--gold); }
.kgood { color: var(--goodT); font-size: 13px; margin: 6px 0 2px 4px; }
.kcards { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 8px; margin: 0 0 10px; }
.kcard { background: var(--raised); border: 1px solid var(--line); border-top: 2px solid var(--line2); border-radius: 8px; padding: 9px 12px; font-size: 13px; color: var(--soft); }
.kcard.wip { border-top-color: #e8a23a; } .kcard.ok { border-top-color: #45c15c; } .kcard.bad { border-top-color: #e5534b; } .kcard.up { border-top-color: #5aa9ff; }
.kct { font: 700 12.5px Barlow, sans-serif; margin-bottom: 6px; } .kcard.wip .kct { color: #e8a23a; } .kcard.ok .kct { color: var(--goodT); } .kcard.bad .kct { color: var(--badT); } .kcard.up .kct { color: #5aa9ff; }
.kcard p { margin: 0; } .kci { margin: 0 0 6px; } .kci b { color: var(--text); } .kcs { display: block; color: var(--faint); font-size: 12px; } .kno { color: var(--faint); margin: 0; font-size: 13px; }
.kw { display: flex; gap: 9px; border-left: 3px solid var(--warn); background: rgba(0,0,0,.12); border-radius: 6px; padding: 8px 10px 8px 8px; margin: 0 0 7px; } .kw.bad { border-left-color: var(--bad); } .kw[data-cr] { cursor: pointer; }
.kwn { flex: 0 0 20px; height: 20px; border-radius: 50%; background: rgba(232,162,58,.22); color: var(--warn); font: 700 12px/20px Barlow, sans-serif; text-align: center; } .kw.bad .kwn { background: rgba(229,83,75,.22); color: var(--bad); }
.kwb { flex: 1; min-width: 0; } .kwt { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; } .kwt b { font-size: 13.5px; } .kwt i { margin-left: auto; color: var(--faint); font-style: normal; font-weight: 700; }
.kwg { font: 700 11.5px Barlow, sans-serif; color: var(--warn); } .kw.bad .kwg { color: var(--badT); }

<body>
<div class="wrap" id="app"><div class="empty">Your recap shows here after a boss pull.</div></div>
<script>
(() => {
'use strict';
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const CC = { WARRIOR: '#C69B6D', PALADIN: '#F48CBA', HUNTER: '#AAD372', ROGUE: '#FFF468', PRIEST: '#FFFFFF', DEATHKNIGHT: '#C41E3A', SHAMAN: '#0070DD', MAGE: '#3FC7EB', WARLOCK: '#8788EE', MONK: '#00FF98', DRUID: '#FF7C0A', DEMONHUNTER: '#A330C9', EVOKER: '#33937F' };
const KCOL = { own: '#e5534b', ready: '#e5534b', on: '#e5534b', half: '#e8a23a', nothing: '#e8a23a' };
const LOGO = '<svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="pm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff4cf"/><stop offset=".5" stop-color="#d9a441"/><stop offset="1" stop-color="#7a4f14"/></linearGradient><linearGradient id="pe" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c8ffd2"/><stop offset="1" stop-color="#178a3c"/></linearGradient></defs><path d="M32 2 57 11.5V30c0 15.5-11.3 26.6-25 32C18.3 56.6 7 45.5 7 30V11.5Z" fill="url(#pm)"/><path d="M32 9.2 50.5 16.3V30c0 11.7-8.3 20.2-18.5 24.5C21.8 50.2 13.5 41.7 13.5 30V16.3Z" fill="#161a25"/><path fill-rule="evenodd" fill="url(#pm)" d="M21 18h11c9.5 0 14.5 6 14.5 14S41.5 46 32 46H21Z M26.5 23.5H32c5.6 0 9 3.4 9 8.5s-3.4 8.5-9 8.5h-5.5Z"/><path d="m29 32.4 2.7 2.7 5.6-6.1" fill="none" stroke="url(#pe)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const wv = window.chrome && window.chrome.webview;
const post = (m) => { try { if (wv) wv.postMessage(m); else console.log('popup →', m); } catch (e) { /* not in the app */ } };
// (spell icons: the same cache as the app's main window, which shares this address)
let ICONS = {}; try { ICONS = JSON.parse(localStorage.getItem('dbf-icons') || '{}') || {}; } catch (e) { ICONS = {}; }
function ic(id) {
  if (!id) return '';
  if (!/^\d+$/.test(String(id))) return '<span class="ic"><img src="https://wow.zamimg.com/images/wow/icons/medium/' + esc(String(id).toLowerCase()) + '.jpg" alt="" onerror="this.remove()"></span>'; /* (an icon's own name, e.g. inv_stone_04) */
  const n = ICONS[id]; if (n) return '<span class="ic"><img src="https://wow.zamimg.com/images/wow/icons/medium/' + esc(n) + '.jpg" alt=""></span>';
  fetch('https://nether.wowhead.com/tooltip/spell/' + encodeURIComponent(id) + '?dataEnv=1&locale=0').then((r) => r.json()).then((x) => {
    if (!x || !x.icon) return; ICONS[id] = x.icon; try { localStorage.setItem('dbf-icons', JSON.stringify(ICONS)); } catch (e) { /* fine */ }
    document.querySelectorAll('[data-ic="' + id + '"]').forEach((el) => { el.innerHTML = '<img src="https://wow.zamimg.com/images/wow/icons/medium/' + x.icon + '.jpg" alt="">'; });
  }).catch(() => {});
  return '<span class="ic" data-ic="' + esc(id) + '"></span>';
}
let D = null; const OPEN = {};
/* (Detailed or Heavy in the addon's settings: every section starts open) */ const DEEP = () => !!D && (D.look === 'detailed' || D.look === 'heavy' || (D.lk && (D.lk.preset === 'detailed' || D.lk.preset === 'heavy'))), isOpen = (k) => (OPEN[k] != null ? !!OPEN[k] : DEEP()); let copied = false, big = false;
// ---------- the /recap card, drawn in the pop-up (Oct 24, the user's pick: "the pop-up copies /recap") ----------
// The same card the addon shows, from the same recap: your Me view and the Raid view, the sections and line counts you picked in /db,
// two columns in the wide window. Data: D.card (the recap, up to the wipe call), D.lk (your /db settings and who you are).
let VIEW = null;
const FLC = { ok: '#45c15c', warn: '#e8a23a', bad: '#e5534b', dead: '#6c7381', info: '#6c7381', next: '#e6b450' };
const SQC = { g: '#45c15c', w: '#e8a23a', b: '#e5534b' };
const reEsc = (s) => String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function cardView() {
  const C = D.card, LK = D.lk || {}, SH = LK.show || {}, MX = LK.max || {}, deep = LK.preset === 'detailed' || LK.preset === 'heavy';
  const on = (k, def) => (SH[k] == null ? def !== false : !!SH[k]);
  const PL = C.players || [], short = (n) => String(n || '').split('-')[0];

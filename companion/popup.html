<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Debrief recap</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* The recap pop-up (Oct 22): the in-game card's coach box, floating over WoW right after a pull, without taking focus.
   Debriefing's own coach box, word for word. */
:root { --bg: #171a22; --raised: #1e222c; --line: #2a2f3b; --line2: #353b49; --text: #ece8df; --muted: #98a0ad; --faint: #6c7381; --soft: #d6d1c6;
  --gold: #e6b450; --gold-ink: #1b1406; --em: #5fdc7a; --good: #45c15c; --goodT: #7ee08f; --bad: #e5534b; --badT: #ff8f87; --warn: #e8a23a; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 Barlow Condensed, 'Segoe UI', system-ui, sans-serif; overflow: hidden; }
body { border: 1px solid var(--line2); border-radius: 10px; }
/* (a kill (Oct 25, the Design studio's round 3, like the site's boss banner): the edge goes gold with a glow for 1.8 s, then a 1px gold edge;
   the raid lead's first line a size up. Nothing moves under reduced motion) */
body.is-kill { border-color: rgba(230,180,80,.85); box-shadow: inset 0 0 0 1px rgba(230,180,80,.45), inset 0 0 30px rgba(230,180,80,.16); }
body.is-kill.k-anim { animation: killGlow 1.8s ease-out both; }
@keyframes killGlow { 0% { box-shadow: inset 0 0 0 2px rgba(230,180,80,.95), inset 0 0 70px rgba(230,180,80,.34); } 100% { box-shadow: inset 0 0 0 1px rgba(230,180,80,.45), inset 0 0 30px rgba(230,180,80,.16); } }
body.is-kill .kyou .kv { font-size: 17px; }
@media (prefers-reduced-motion: reduce) { body.k-anim { animation: none !important; } .mini { animation: none !important; } }
.wrap { display: flex; flex-direction: column; max-height: 100vh; }
.top { display: flex; align-items: center; gap: 8px; padding: 10px 10px 9px 14px; border-bottom: 1px solid var(--line); app-region: drag; -webkit-app-region: drag; cursor: move; flex: none; }
.top svg { width: 17px; height: 19px; flex: none; }
.top b { font: 700 17px Barlow Condensed, sans-serif; }
.top .bt { font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.top .pill { margin-left: auto; font: 700 13px Barlow Condensed, sans-serif; border-radius: 5px; padding: 2px 9px; background: #3a1d1d; color: var(--badT); white-space: nowrap; }
.top .pill.k { background: #17301e; color: var(--goodT); }
.x { app-region: no-drag; -webkit-app-region: no-drag; background: none; border: 0; color: var(--faint); font-size: 16px; width: 26px; height: 26px; border-radius: 5px; cursor: pointer; flex: none; }
.x:hover { color: var(--text); background: var(--raised); }
.body { padding: 12px 14px 4px; overflow: auto; flex: 1; min-height: 0; }
.body::-webkit-scrollbar { width: 8px; } .body::-webkit-scrollbar-thumb { background: #2f3542; border-radius: 4px; }
.cl { color: var(--gold); font: 700 12.5px/1 Barlow Condensed, sans-serif; letter-spacing: .05em; margin: 2px 0 8px; } .cl.mut { color: var(--muted); margin-top: 6px; }

.cfoc div { color: var(--gold); font: 700 12.5px/1 Barlow Condensed, sans-serif; letter-spacing: .05em; margin-bottom: 6px; }
.cfoc p { margin: 0; font: 600 15px/1.4 Barlow Condensed, sans-serif; }
.cw { display: flex; gap: 10px; background: var(--raised); border: 1px solid var(--line); border-left: 3px solid var(--warn); border-radius: 6px; padding: 10px 12px 10px 9px; margin-bottom: 8px; } .cw.bad { border-left-color: var(--bad); }
.cn { flex: 0 0 22px; height: 22px; border-radius: 50%; background: rgba(232,162,58,.25); color: var(--warn); font: 700 13.5px/22px Barlow Condensed, sans-serif; text-align: center; } .cw.bad .cn { background: rgba(229,83,75,.25); color: var(--bad); }
.cwb { flex: 1; min-width: 0; } .cwt { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; } .cwt b { font: 600 15px/1.3 Barlow Condensed, sans-serif; }
.tg { font: 700 12.5px Barlow Condensed, sans-serif; color: var(--warn); } .cw.bad .tg { color: var(--badT); }
.cwh { color: var(--muted); font: 14px/1.4 Barlow Condensed, sans-serif; margin: 5px 0; }
.cfx { display: flex; gap: 10px; font: 14.5px/1.4 Barlow Condensed, sans-serif; color: var(--soft); margin-top: 5px; } .cfx span:first-child { flex: 0 0 70px; white-space: nowrap; color: var(--gold); font: 700 12.5px/1.6 Barlow Condensed, sans-serif; letter-spacing: .04em; }
.cok { display: flex; gap: 8px; color: var(--goodT); font: 14.5px/1.4 Barlow Condensed, sans-serif; margin: 4px 0 6px; } .cok span { color: var(--good); font-weight: 700; }
.more { color: var(--faint); font-size: 13.5px; margin: 0 0 8px; }
.cfd { background: var(--raised); border: 1px solid var(--line); border-radius: 6px; margin-top: 8px; padding: 0 12px; }

.cr .t { color: var(--faint); width: 30px; flex: none; } .cr i { width: 8px; height: 8px; border-radius: 50%; flex: none; } .cr b { font-weight: 600; white-space: nowrap; }

.btn { background: var(--gold); color: var(--gold-ink); border: 1px solid var(--gold); border-radius: 7px; padding: 7px 14px; font: 600 14.5px Barlow Condensed, sans-serif; cursor: pointer; white-space: nowrap; }
.btn:hover { background: #efc265; }
.btn.done { background: #17301e; border-color: #2b5a36; color: var(--goodT); cursor: default; }
.lnk { background: none; border: 0; padding: 0; color: var(--muted); font: 600 13.5px Barlow Condensed, sans-serif; cursor: pointer; white-space: nowrap; }
.lnk:hover { color: var(--text); }
.hint { color: var(--faint); font-size: 13px; margin-left: auto; text-align: right; }
.empty { padding: 30px 16px; text-align: center; color: var(--muted); }
.body.sitebody { padding: 10px 10px 4px; }
/* tonight's pulls, one chip each: red for a wipe (with how much was left), green for a kill, a gold edge on the best */
.pulls { display: flex; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--line); overflow-x: auto; flex: none; scrollbar-width: thin; }
.pulls::-webkit-scrollbar { height: 6px; } .pulls::-webkit-scrollbar-thumb { background: #2f3542; border-radius: 3px; }

.pc.k { background: #17301e; color: var(--goodT); }
.pc.best { border-color: rgba(230,180,80,.7); }
.pc.on { border-color: var(--text); color: var(--text); }
.pc:hover { filter: brightness(1.25); }
.pc.wait { opacity: .6; }
.pb { flex: none; align-self: center; font: 700 12px Barlow Condensed, sans-serif; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); padding: 0 2px 0 6px; white-space: nowrap; }
.pb:first-child { padding-left: 0; }
/* Stop at death, over the coach box (the same filter as the website and the card) */
.stp { display: flex; align-items: center; justify-content: space-between; background: var(--raised); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; margin: 0 0 4px; }
.stp b { font: 700 14px Barlow Condensed, sans-serif; }
.stpc { display: flex; align-items: center; gap: 4px; }
.stpc button { width: 24px; height: 22px; border-radius: 5px; border: 0; background: var(--bg); color: var(--muted); font: 700 14px Barlow Condensed, sans-serif; cursor: pointer; }
.stpc button:hover { color: var(--gold); }

.stpn { margin: 0 2px 10px; color: var(--faint); font-size: 13px; }
.stp { margin: 0 0 10px; } .stpt { border: 1px solid var(--line); background: var(--bg); color: var(--muted); font: 700 13px Barlow Condensed, sans-serif; border-radius: 6px; padding: 3px 12px; cursor: pointer; } .stpt.on { background: #e6b450; border-color: #e6b450; color: #161a25; } .stpi { font: 400 13.5px Barlow Condensed, sans-serif; font-style: normal; color: var(--faint); margin-left: 8px; }
/* the slim bar a pull opens with: one click for the whole card */
body.isMini { border-color: rgba(230,180,80,.85); box-shadow: inset 0 0 0 1px rgba(230,180,80,.25); background: linear-gradient(90deg, rgba(230,180,80,.16), rgba(230,180,80,.04) 60%), var(--bg); }

@keyframes slideIn { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }

.khead .kres.k { border-color: rgba(69,193,92,.6); background: rgba(69,193,92,.12); color: #7ee08f; } .khead .kres.p { border-color: var(--line2); background: var(--raised); color: var(--muted); }

.kpulls span.on { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); } /* (coloured by how far the pull got; the open one ringed gold (Oct 25)) */ .kpulls span.wait { opacity: .6; }
.ktabs .kwho { margin-left: auto; display: flex; align-items: center; gap: 10px; cursor: default; padding: 0 0 4px; } .ktabs .kwho button { border: 1px solid var(--line2); background: var(--raised); color: var(--muted); border-radius: 5px; width: 26px; height: 24px; cursor: pointer; font: 700 14px Barlow Condensed, sans-serif; }

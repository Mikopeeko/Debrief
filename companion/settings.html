<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Debrief settings</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- The settings window (Nov 3, the studio's settings-brief.md, Flex: "i want it to look nicer and be more organized", then "Yes, send it"): every
     setting of the recap pop-up, on this PC (the addon in WoW only keeps the combat log on now). Saves as you go, in this app's own storage
     ('dbf-set'), which the pop-up reads; the preview on the right is the pop-up itself, drawn by popup.html -->
<style>
:root { --page: #0b0d10; --win: #121418; --panel: #15181d; --raised: #1b1f25; --line: #232830; --line2: #2a2f38; --text: #e8eaed; --muted: #9aa3ac; --faint: #6b737c;
  --gold: #f2c46b; --green: #7ee08f; --amber: #f2c46b; --red: #ff8f87; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--win); color: var(--text); font: 13px 'Barlow Condensed', 'Segoe UI', system-ui, sans-serif; overflow: hidden; }
body { display: flex; flex-direction: column; border: 1px solid var(--line2); }
button { font: inherit; color: inherit; }
.tb { height: 42px; flex: none; display: flex; align-items: center; gap: 9px; padding: 0 8px 0 14px; border-bottom: 1px solid var(--line); app-region: drag; -webkit-app-region: drag; user-select: none; }
.logo { width: 22px; height: 22px; flex: none; } .logo svg { width: 22px; height: 22px; display: block; }
.tb .t { font: 700 15px 'Barlow Condensed', sans-serif; letter-spacing: .2px; }
.tb .s { color: var(--faint); font-size: 12.5px; }
.tb .x { margin-left: auto; app-region: no-drag; -webkit-app-region: no-drag; background: none; border: 0; color: var(--muted); font-size: 17px; width: 30px; height: 30px; border-radius: 4px; cursor: pointer; }
.tb .x:hover { background: var(--raised); color: var(--text); }
.main { flex: 1; display: flex; min-height: 0; }
/* the rail */
.rail { width: 188px; flex: none; border-right: 1px solid var(--line); padding: 10px 8px; display: flex; flex-direction: column; gap: 2px; }
.rail a { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 4px; color: var(--muted); font: 600 13.5px 'Barlow Condensed', sans-serif; text-decoration: none; cursor: pointer; user-select: none; }
/* (each page's colour (the studio, Nov 3): Pop-up blue, Your card your class, Look violet, Setup green or amber; the tile is stronger on the open page) */
.rail a .pt { width: 22px; height: 22px; flex: none; border-radius: 6px; display: grid; place-items: center; background: color-mix(in srgb, var(--ic) 20%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ic) 45%, transparent); }
.rail a .pt svg { width: 14px; height: 14px; stroke: var(--ic); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.rail a.on .pt { background: color-mix(in srgb, var(--ic) 32%, transparent); }
.rail a:hover { background: var(--raised); color: var(--text); }
.rail a.on { background: var(--raised); color: var(--text); }
.rail a .n { margin-left: auto; font: 600 11.5px 'Barlow Condensed', sans-serif; color: var(--faint); }
.rail a .n.ok { color: var(--green); } .rail a .n.am { color: var(--amber); }
.rail .foot { margin-top: auto; padding: 8px 10px; color: var(--faint); font-size: 12px; line-height: 1.5; border-top: 1px solid var(--line); }
.rail .foot b { color: var(--muted); font-weight: 600; }
/* the page */
.mid { flex: 1; min-width: 0; overflow-y: auto; overflow-x: hidden; padding: 16px 22px 18px; scrollbar-width: thin; scrollbar-color: #2a2f38 transparent; }
.pg { display: none; max-width: 640px; } .pg.on { display: block; }
.h1 { display: flex; align-items: baseline; gap: 10px; }
.h1 h1 { margin: 0; font: 700 18px 'Barlow Condensed', sans-serif; }
.h1 .mono { color: var(--muted); font-size: 12px; }
.ptile { width: 26px; height: 26px; flex: none; border-radius: 7px; display: grid; place-items: center; align-self: center; background: color-mix(in srgb, var(--ic) 20%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ic) 45%, transparent); }
.ptile svg { width: 15px; height: 15px; stroke: var(--ic); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.h1 .rs, .h1 .pvl { margin-left: auto; }
.h1 .rs + .pvl { margin-left: 14px; }
.hint { color: var(--muted); font-size: 12.5px; margin: 2px 0 10px; }
.lab { font: 600 11.5px 'Barlow Condensed', sans-serif; text-transform: uppercase; letter-spacing: .04em; color: var(--faint); margin: 14px 0 2px; }
.lab em { font-style: normal; text-transform: none; letter-spacing: 0; color: var(--faint); font-weight: 500; margin-left: 6px; }
.ld { display: inline-block; width: 7px; height: 7px; border-radius: 2px; margin-right: 6px; transform: translateY(-1px); }
/* (each row's icon in the colour that part uses on the card; grey when hidden) */
.rtile { width: 24px; height: 24px; flex: none; border-radius: 6px; display: grid; place-items: center; background: color-mix(in srgb, var(--ic) 16%, transparent); }
.rtile svg { width: 14px; height: 14px; stroke: var(--ic); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.row.off .rtile { filter: grayscale(1); opacity: .5; }
/* (Your card: three starts with a "how full" mark, then the fold) */
.pre { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 4px 0 10px; }
.pc { display: flex; flex-direction: column; justify-content: flex-start; text-align: left; background: none; border: 1px solid var(--line2); border-radius: 4px; padding: 9px 11px; cursor: pointer; color: var(--text); }
.pc:hover { border-color: #4a505a; }
.pc b { display: block; font: 700 14.5px 'Barlow Condensed', sans-serif; } .pc span { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; line-height: 1.35; }
.pc.on { border-color: var(--gold); background: rgba(242,196,107,.05); } .pc.on b { color: var(--gold); }
.dens { display: flex; gap: 2px; align-items: flex-end; height: 14px; margin-bottom: 6px; }
.dens s { display: block; width: 5px; border-radius: 1px; background: #3a404c; text-decoration: none; }
.dens s:nth-child(1) { height: 6px; } .dens s:nth-child(2) { height: 10px; } .dens s:nth-child(3) { height: 14px; }
.d1 s:nth-child(1), .d2 s:nth-child(-n+2), .d3 s { background: #9aa3ac; }
.pc.on .d1 s:nth-child(1), .pc.on .d2 s:nth-child(-n+2), .pc.on .d3 s { background: var(--gold); }
.fold { display: flex; width: calc(100% + 16px); align-items: baseline; gap: 8px; margin: 10px -8px 0; padding: 9px 8px; border: 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: none; cursor: pointer; font: 600 14px 'Barlow Condensed', sans-serif; color: var(--text); text-align: left; }
.fold:hover { background: var(--raised); }
.fold .ar { color: var(--muted); font-size: 11px; display: inline-block; transition: transform .15s; } .fold.open .ar { transform: rotate(90deg); }
.fold em { font-style: normal; color: var(--faint); font-weight: 500; font-size: 12.5px; }
.row { display: flex; align-items: center; gap: 12px; min-height: 36px; padding: 5px 8px; margin: 0 -8px; border-radius: 4px; border-bottom: 1px solid rgba(255,255,255,.04); }
.row:hover { background: var(--raised); }
.row.click { cursor: pointer; user-select: none; }
.row .nm { font: 600 13.5px 'Barlow Condensed', sans-serif; }
.row .ds { color: var(--muted); font-size: 12px; margin-top: 1px; }
.row .tx { flex: 1; min-width: 0; }
.row .ct { display: flex; align-items: center; gap: 6px; flex: none; color: var(--muted); font: 600 12.5px 'Barlow Condensed', sans-serif; font-variant-numeric: tabular-nums; }
.row.off .nm { color: var(--faint); text-decoration: line-through; }
.row.off .ds { color: #555c64; }
.row.am { background: rgba(242,196,107,.05); }
.eye { width: 18px; height: 18px; flex: none; stroke: var(--muted); fill: none; stroke-width: 1.6; }
.row:hover .eye { stroke: var(--gold); }
.row.off .eye { stroke: #555c64; }
.tg { width: 30px; height: 17px; border-radius: 9px; background: #2a2f38; position: relative; flex: none; cursor: pointer; border: 0; padding: 0; }
.tg::after { content: ""; position: absolute; left: 2px; top: 2px; width: 13px; height: 13px; border-radius: 50%; background: #7b838c; transition: left .15s; }
.tg.on { background: rgba(126,224,143,.28); }
.tg.on::after { left: 15px; background: var(--green); }
.st { display: flex; align-items: center; gap: 2px; }
.st button { background: none; border: 0; color: var(--faint); padding: 0 4px; cursor: pointer; font-size: 14px; line-height: 1; }
.st button:hover { color: var(--text); } .st button:disabled { opacity: .3; cursor: default; }
.st b { min-width: 30px; text-align: center; color: var(--text); font-weight: 600; }
.row.off .st { opacity: .35; } .ct.off .seg { opacity: .4; }
.seg { display: flex; gap: 14px; flex: none; }
.seg button { background: none; border: 0; color: var(--muted); font: 600 13px 'Barlow Condensed', sans-serif; padding: 3px 0; cursor: pointer; }
.seg button:hover { color: var(--text); }
.seg button.on { color: var(--text); box-shadow: inset 0 -2px 0 var(--gold); }
.sel { min-width: 140px; display: flex; justify-content: space-between; gap: 8px; border: 0; border-bottom: 1px solid var(--line2); padding: 2px 0; background: none; color: var(--text); font: 600 13px 'Barlow Condensed', sans-serif; cursor: pointer; position: relative; flex: none; }
.sel em { font-style: normal; color: var(--faint); }
.dd { position: absolute; right: 0; top: calc(100% + 4px); z-index: 5; min-width: 180px; background: var(--raised); border: 1px solid var(--line2); border-radius: 4px; padding: 4px; box-shadow: 0 10px 28px rgba(0,0,0,.5); }
.dd button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 6px 8px; border-radius: 3px; font: 600 13px 'Barlow Condensed', sans-serif; cursor: pointer; color: var(--text); }
.dd button:hover, .dd button.on { background: #242932; }
.kc { height: 24px; display: flex; align-items: center; gap: 4px; padding: 0 8px; border: 1px solid var(--line2); border-radius: 4px; color: var(--text); font: 600 12.5px 'Barlow Condensed', sans-serif; flex: none; }
.kc kbd { font: inherit; padding: 0 4px; border-radius: 3px; background: #20242b; }
.kc.wait { border-color: var(--gold); color: var(--gold); }
.btn { height: 28px; display: inline-flex; align-items: center; padding: 0 12px; border: 1px solid var(--line2); border-radius: 4px; color: var(--text); font: 600 12.5px 'Barlow Condensed', sans-serif; background: transparent; cursor: pointer; flex: none; }
.btn:hover { border-color: #4a505a; background: var(--raised); }
.lk { color: var(--gold); font: 600 12.5px 'Barlow Condensed', sans-serif; background: none; border: 0; padding: 0; cursor: pointer; flex: none; }
.lk:hover { text-decoration: underline; }
.msg { color: var(--amber); font-size: 12px; margin-top: 2px; }
.sl { display: flex; align-items: center; gap: 10px; flex: none; }
.sl input { width: 150px; accent-color: #d7dbe0; height: 3px; cursor: pointer; }
.sl span { min-width: 38px; text-align: right; color: var(--text); font-weight: 600; }
.sw { display: flex; gap: 8px; flex: none; }
.sw button { width: 22px; height: 22px; border-radius: 4px; border: 1px solid rgba(255,255,255,.1); cursor: pointer; padding: 0; }
.sw button.on { outline: 2px solid var(--text); outline-offset: 2px; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--green); margin-left: 2px; }
.dot.am { background: var(--amber); } .dot.no { background: #555c64; }
.path { color: var(--muted); font-size: 12px; word-break: break-all; }
/* the preview */
.pv { width: 330px; flex: none; border-left: 1px solid var(--line); padding: 14px 0 0; display: flex; flex-direction: column; background: #0f1114; min-height: 0; }
.pv .lab { margin: 0 14px 8px; display: flex; align-items: baseline; }
.pv .pvhide { display: none; margin-left: auto; text-transform: none; letter-spacing: 0; }
.pv .lab em { font-style: normal; color: var(--faint); text-transform: none; letter-spacing: 0; font-weight: 500; margin-left: 4px; }
.pv iframe { flex: 1; min-height: 0; width: 100%; border: 0; display: block; background: #0f1114; }
.pv .cap { color: var(--faint); font-size: 12px; margin: 8px 14px 10px; flex: none; }
.pvl { display: none; }
/* (below about 1000 px the preview waits behind a link; never a sideways scroll) */
@media (max-width: 999px) {
  .pv { display: none; position: absolute; right: 0; top: 42px; bottom: 0; z-index: 6; box-shadow: -14px 0 30px rgba(0,0,0,.5); }
  body.pvopen .pv { display: flex; }
  .pvl { display: inline; } .pv .pvhide { display: inline; }
}
</style></head><body>
<div class="tb"><span class="logo" id="logo"></span><span class="t">Debrief settings</span><span class="s">Saves as you go</span><button class="x" type="button" id="close" title="Close">✕</button></div>
<div class="main">
  <nav class="rail" id="rail"></nav>
  <div class="mid" id="mid"></div>
  <aside class="pv" id="pv"><div class="lab">Preview<em id="pvWhat">a sample pull</em><button type="button" class="lk pvhide" data-pv="1">Hide preview</button></div><iframe id="pvF" title="Preview" src="/popup?preview=1"></iframe><div class="cap" id="pvCap">Hidden rows drop out of the preview straight away.</div></aside>
</div>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const LOGO = '<svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="pm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff4cf"/><stop offset=".5" stop-color="#d9a441"/><stop offset="1" stop-color="#7a4f14"/></linearGradient><linearGradient id="pe" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c8ffd2"/><stop offset="1" stop-color="#178a3c"/></linearGradient></defs><path d="M32 2 57 11.5V30c0 15.5-11.3 26.6-25 32C18.3 56.6 7 45.5 7 30V11.5Z" fill="url(#pm)"/><path d="M32 9.2 50.5 16.3V30c0 11.7-8.3 20.2-18.5 24.5C21.8 50.2 13.5 41.7 13.5 30V16.3Z" fill="#161a25"/><path fill-rule="evenodd" fill="url(#pm)" d="M21 18h11c9.5 0 14.5 6 14.5 14S41.5 46 32 46H21Z M26.5 23.5H32c5.6 0 9 3.4 9 8.5s-3.4 8.5-9 8.5h-5.5Z"/><path d="m29 32.4 2.7 2.7 5.6-6.1" fill="none" stroke="url(#pe)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'; /* (the pop-up's own logo) */
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const wv = window.chrome && window.chrome.webview;
const post = (m) => { try { if (wv) wv.postMessage(m); } catch (e) { /* not in the app */ } };
async function j(url, opt) { const r = await fetch(url, opt); const x = await r.json().catch(() => ({})); if (!r.ok) throw new Error(x.error || ('HTTP ' + r.status)); return x; }
const postJ = (url, body) => j(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });

// ---------- the settings: one object in this app's storage, shared with the pop-up and the Companion window ----------
const KEY = 'dbf-set';
// (the three starts, as the addon's PRESETS were (Oct 24), now with every row honest: Simple hides what its short card never showed)
const ALL = ['tile', 'rotation', 'boss', 'surv', 'cons', 'next', 'trend', 'chips', 'died', 'chartLine', 'chartNight', 'grade', 'mechs', 'coach', 'right', 'cdeaths', 'cavoid', 'rdefs', 'rcons'];
const PRE = {
  simple: { off: ['rotation', 'boss', 'surv', 'cons', 'trend', 'chips', 'died', 'chartLine', 'chartNight', 'grade', 'mechs', 'right', 'cdeaths', 'cavoid', 'rdefs', 'rcons'], max: { maxSlips: 1, maxBoss: 1, maxRaid: 1, maxDied: 3, maxMech: 3 }, openSecs: true },
  standard: { off: ['chartLine', 'chartNight', 'grade', 'mechs'], max: { maxSlips: 3, maxBoss: 3, maxRaid: 3, maxDied: 3, maxMech: 6 }, openSecs: false },
  detailed: { off: [], max: { maxSlips: 8, maxBoss: 7, maxRaid: 5, maxDied: 6, maxMech: 12 }, openSecs: true },
};
const showOf = (p) => { const o = {}; for (const k of ALL) o[k] = !PRE[p].off.includes(k); return o; };
const DEF = () => ({ v: 1, preset: 'standard', show: showOf('standard'), max: Object.assign({}, PRE.standard.max), openSecs: false, onlyBad: false, bossFirst: false, goalHps: 0, goalDps: 0,
  hideFight: true, autoClose: 0, remind: true, remindMins: 30, side: 'right', screen: 'main', lock: false, accent: 'class', colorblind: false, style: 'panels', font: 'debrief', size: 1, bg: 0.97, me: '' });
const load = () => { let s = null; try { s = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { s = null; } const d = DEF(); if (!s) return d; s.show = Object.assign(d.show, s.show || {}); s.max = Object.assign(d.max, s.max || {}); return Object.assign(d, s); };
let S = load();
const sw = (k, def) => { try { const v = localStorage.getItem('dbf-sw-' + k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } }; /* (Pop up stays where the Companion window keeps it) */
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* full: kept for this window */ } pvApply(); draw(); }
const changed = () => { const p = PRE[S.preset] || PRE.standard, sh = showOf(S.preset in PRE ? S.preset : 'standard'); return ALL.some((k) => !!S.show[k] !== sh[k]) || Object.keys(p.max).some((k) => S.max[k] !== p.max[k]) || !!S.openSecs !== !!p.openSecs; };

// ---------- the rows ----------
const EYE = '<svg class="eye" viewBox="0 0 20 20" aria-hidden="true"><path d="M1.5 10S5 4 10 4s8.5 6 8.5 6-3.5 6-8.5 6S1.5 10 1.5 10z"/><circle cx="10" cy="10" r="2.6"/></svg>';
const EYEX = '<svg class="eye" viewBox="0 0 20 20" aria-hidden="true"><path d="M1.5 10S5 4 10 4s8.5 6 8.5 6-3.5 6-8.5 6S1.5 10 1.5 10z"/><path d="M3 17L17 3"/></svg>';
// [id, name, description, show keys, count key, min, max]
const CARD = [['num', 'Your number', '', ['tile']], ['rot', 'Rotation tips', '', ['rotation'], 'maxSlips', 1, 8], ['boss', 'Boss mistakes', 'Your mistakes, avoidable damage, kicks and dispels.', ['boss'], 'maxBoss', 1, 7],
  ['surv', 'Survival', 'Your defensives, Healthstone and potion.', ['surv', 'cons']], ['next', 'Next pull tip', '', ['next']], ['trend', 'Worse and better', 'Than your last pull.', ['trend']],
  ['chips', 'Your last pulls', 'Along the top. Click one to look at it again.', ['chips']], ['died', 'Who died', 'Who died first, and to what.', ['died'], 'maxDied', 1, 8],
  ['chart', 'Charts', 'Your numbers and how far, pull by pull tonight.', ['chartLine', 'chartNight']], ['grade', 'Report card grade', '', ['grade']], ['mech', 'Boss mechanics', 'How each mechanic went, worst first.', ['mechs'], 'maxMech', 1, 16]];
const RAID = [['coach', 'Raid lead box', 'The headline, what wiped us and the other big mistakes.', ['coach'], 'maxRaid', 1, 5], ['right', 'What went right', '', ['right']], ['cdeaths', 'Deaths', '', ['cdeaths']],
  ['cavoid', 'Avoidable damage', '', ['cavoid']], ['rmech', 'Boss mechanics', 'How each mechanic went, worst first.', ['mechs']], ['rdefs', 'Defensives', 'Who pressed a defensive, and who never did.', ['rdefs']], ['rcons', 'Healthstones', 'Who dropped low with one still ready.', ['rcons']]];
const SK = '<path d="M8 2a5 5 0 0 0-5 5c0 1.8.9 3 2 3.6V13h6v-2.4c1.1-.6 2-1.8 2-3.6a5 5 0 0 0-5-5z"/><circle cx="6" cy="7.2" r=".9"/><circle cx="10" cy="7.2" r=".9"/>', TRI = '<path d="M8 2l6 11H2z"/><path d="M8 6.5v3M8 11.3v.2"/>',
  SHD = '<path d="M8 1.8l5 2v4c0 3.2-2.2 5.3-5 6.4-2.8-1.1-5-3.2-5-6.4v-4z"/>', CLK = '<circle cx="8" cy="8" r="5.5"/><path d="M8 5v3l2 1.5"/>';
const RI = { num: ['', '<path d="M2 13h12M4 11V7M8 11V4M12 11V8"/>'], rot: ['#f2c46b', '<path d="M8 2.5a5.5 5.5 0 1 1-5.2 3.7"/><path d="M2.5 2.8v3.4h3.4"/>'], boss: ['#ff8f87', TRI], surv: ['#7d9be8', SHD],
  next: ['#7ee08f', '<path d="M2.5 8h10M9 4.5L12.5 8 9 11.5"/>'], trend: ['#6fc7b4', '<path d="M5 13V3M2.5 5.5L5 3l2.5 2.5M11 3v10M8.5 10.5L11 13l2.5-2.5"/>'],
  chips: ['#c9ced4', '<rect x="1.5" y="4" width="3.5" height="8" rx="1"/><rect x="6.25" y="4" width="3.5" height="8" rx="1"/><rect x="11" y="4" width="3.5" height="8" rx="1"/>'], died: ['#ff8f87', SK],
  chart: ['#a98bf0', '<path d="M2 12l4-4 3 2 5-6"/>'], grade: ['#e6b450', '<path d="M8 2l1.8 3.9 4.2.5-3.1 2.9.8 4.2L8 11.4 4.3 13.5l.8-4.2L2 6.4l4.2-.5z"/>'], mech: ['#e8a25a', CLK],
  coach: ['#f2c46b', '<path d="M2.5 4.5h11v6h-6l-3 2.5v-2.5h-2z"/>'], right: ['#7ee08f', '<path d="M3 8.5l3 3 7-7"/>'], cdeaths: ['#ff8f87', SK], cavoid: ['#e8a25a', TRI], rmech: ['#e8a25a', CLK], rdefs: ['#7d9be8', SHD],
  rcons: ['#7ee08f', '<path d="M8 2l4.5 4-4.5 8-4.5-8z"/>'] };

$('close').addEventListener('click', () => { if (window.DBF_TOUR) DBF_TOUR.closed(); post('close'); });
// (another window changed something: the Companion's Pop up, the pop-up's own side after a drag, or the character you're on)
window.addEventListener('storage', (e) => { if (e.key === KEY) S = load(); if (e.key === KEY || e.key === 'dbf-cur-cls' || /^dbf-sw-/.test(e.key || '')) draw(); });

// ---------- the preview: the pop-up itself (popup.html in preview mode), a sample pull or your latest one ----------
const pvW = () => { try { return $('pvF').contentWindow; } catch (e) { return null; } };
function pvApply() { const w = pvW(); try { if (w && w.DBF_SETS) w.DBF_SETS(); } catch (e) { /* still loading */ } }
function pvView() { const w = pvW(); try { if (w && w.DBF_PVVIEW) w.DBF_PVVIEW(PVV); } catch (e) { /* still loading */ } }
const pvFor = (r) => { const v = RAID.includes(r) ? 'raid' : 'me'; if (v !== PVV) { PVV = v; pvView(); } }; /* (a Raid view row turns the preview to the Raid view, a Me row back) */
$('pvF').addEventListener('load', async () => {
  let M = null; try { M = await j('/setup/pull'); } catch (e) { M = null; }
  const w = pvW(); if (!M || !M.data || !w) { $('pvCap').textContent = 'No pull to show yet.'; return; }
  $('pvWhat').textContent = M.sample ? 'a sample pull' : 'your latest pull';
  for (const c of M.data.cls || []) if (c && c[0] && c[1]) PVCLS[short(c[0])] = c[1]; if (PAGE === 'setup' || PAGE === 'look') draw();
  $('pvCap').textContent = M.sample ? 'A made-up pull. Once you raid, your latest pull shows here. Hidden rows drop out straight away.' : 'Your latest pull. Hidden rows drop out straight away.';
  for (let i = 0; i < 25 && !w.DBF_SHOW; i++) await new Promise((r) => setTimeout(r, 120));
  try { w.DBF_SHOW(Object.assign({}, M.data, { full: true }, M.data.lk ? {} : { lk: M.lk || {} })); pvView(); } catch (e) { console.error(e); }
});

async function setupLoad() { try { SETUP = await j('/setup'); } catch (e) { SETUP = SETUP || null; } try { WM = await j('/setup/winmode'); } catch (e) { /* (an older app) */ } draw(); }
async function hkLoad() { try { HK = await j('/hotkey'); } catch (e) { HK = null; } }
$('logo').innerHTML = LOGO;
draw(); hkLoad().then(draw); setupLoad();
post('ready');
</script>
<script>window.DBF_WIN = 'set';</script>
<script src="/tour.js"></script>
</body></html>

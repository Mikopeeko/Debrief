<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spec borders gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #090a0e; --line: #2a2f3b; --text: #ece8df; --muted: #98a0ad; --gold: #e6b450;
    --head: 'Barlow Semi Condensed', 'Arial Narrow', system-ui, sans-serif; --body: 'Barlow', 'Segoe UI', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 44px 28px 80px; background: radial-gradient(1400px 700px at 50% 0, #13151c, var(--bg)); color: var(--text); font: 15px/1.45 var(--body); }
  .intro { max-width: 1240px; margin: 0 auto 40px; }
  .intro h1 { margin: 0 0 6px; font: 700 28px var(--head); }
  .intro p { margin: 0 0 12px; color: var(--muted); max-width: 860px; }
  .nav { display: flex; flex-wrap: wrap; gap: 8px; }
  .nav a { padding: 4px 12px; border: 1px solid var(--line); border-radius: 999px; color: var(--cc); text-decoration: none; font: 600 13px var(--body); background: rgba(0, 0, 0, .3); }
  .nav a.on { border-color: var(--cc); background: rgba(255, 255, 255, .08); }
  .cls { max-width: 1240px; margin: 0 auto; padding: 46px 0 40px; }
  .cls-h { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 14px; margin: 0 0 66px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  .cls-h h2 { margin: 0; font: 700 27px var(--head); color: var(--cc); letter-spacing: .02em; }
  .cls-h span { color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 96px 60px; }

  /* ---- a framed spec card: metal band, inner accent line, corners, crest, clasps ---- */
  .card { position: relative; isolation: isolate; min-height: 214px; padding: 52px 60px 46px; border: 6px solid transparent; border-radius: 3px;
    background: var(--fbg) padding-box, repeating-linear-gradient(90deg, rgba(0, 0, 0, .22) 0 1px, transparent 1px 7px) border-box, var(--band) border-box;
    box-shadow: 0 0 0 1px #040406, inset 0 0 0 1px rgba(0, 0, 0, .9), inset 0 0 80px rgba(0, 0, 0, .6), 0 22px 50px rgba(0, 0, 0, .6); }
  .card::before { content: ''; position: absolute; inset: 6px; border: 1px solid var(--fl2); pointer-events: none; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .55); }
  .card::after { content: ''; position: absolute; inset: -6px; border-radius: 3px; pointer-events: none; padding: 6px;
    background: linear-gradient(180deg, rgba(255, 255, 255, .22), rgba(255, 255, 255, 0) 3px, rgba(0, 0, 0, 0) calc(100% - 3px), rgba(0, 0, 0, .45));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
  .orn { position: absolute; overflow: visible; pointer-events: none; z-index: 3; }
  .corner { width: 150px; height: 150px; }
  .corner.tl { top: -13px; left: -13px; } .corner.tr { top: -13px; right: -13px; transform: scaleX(-1); }
  .corner.bl { bottom: -13px; left: -13px; transform: scaleY(-1); } .corner.br { bottom: -13px; right: -13px; transform: scale(-1, -1); }
  .crest { width: 250px; height: 80px; top: -43px; left: calc(50% - 125px); }
  .clasp { width: 44px; height: 76px; top: calc(50% - 38px); }
  .clasp.l { left: -25px; } .clasp.r { right: -25px; transform: scaleX(-1); }
  .clasp.b { top: auto; bottom: -41px; left: calc(50% - 22px); transform: rotate(-90deg); }
  .in { position: relative; z-index: 1; display: flex; align-items: center; gap: 20px; }
  .in img { width: 66px; height: 66px; flex: none; border-radius: 50%; border: 2px solid var(--acc); box-shadow: 0 0 18px var(--accg); }
  .in h3 { margin: 0; font: 700 26px/1.1 var(--head); color: var(--cc); text-shadow: 0 2px 8px rgba(0, 0, 0, .8); }
  .in .th { margin-top: 3px; font-size: 14.5px; }
  .in .mini { margin-top: 9px; color: var(--muted); font-size: 13.5px; } .in .mini b { color: var(--text); font: 700 19px var(--head); margin-right: 3px; }
  @media (max-width: 1000px) { .grid { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 560px) {
    body { padding: 28px 16px 56px; } .card { padding: 46px 26px 40px; } .corner { width: 112px; height: 112px; }
    .crest { width: 200px; height: 64px; top: -35px; left: calc(50% - 100px); } .clasp.l, .clasp.r { display: none; }
    .in img { width: 52px; height: 52px; } .in h3 { font-size: 22px; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="defs"></defs></svg>
<div class="intro">
  <h1>Spec borders: every class and spec</h1>
  <p>One frame per class, in its own material and motifs, tinted for each spec through its gem, its glow and a spec motif. Shown on a
     small spec card; on the spec page it frames the review header the same way. Everything is drawn here as vectors, with no game art.</p>
  <div class="nav" id="nav"></div>
</div>
<div id="gallery"></div>

<script>
// ===================================================================================================================
// A small toolkit of drawn parts (metals, gems, feathers, leaves, scales, chains, runes), and one builder per class that
// puts its corner, crest and clasp together from them, tinted for each spec.
// ===================================================================================================================
const NS = 'http://www.w3.org/2000/svg', DEFS = document.getElementById('defs');
const E = (tag, at, parent) => { const e = document.createElementNS(NS, tag); if (at) for (const k in at) if (at[k] != null) e.setAttribute(k, at[k]); if (parent) parent.appendChild(e); return e; };
const f2 = (v) => String(Math.round(v * 100) / 100);
const P = (x, y) => f2(x) + ' ' + f2(y);
const poly = (pts) => 'M' + pts.map((p) => P(p[0], p[1])).join(' L') + ' Z';
let UID = 0; const nid = (p) => p + (++UID);
function LIN(stops, x1 = 0, y1 = 0, x2 = 1, y2 = 1) { const id = nid('l'), g = E('linearGradient', { id, x1, y1, x2, y2 }, DEFS); for (const s of stops) E('stop', { offset: s[0], 'stop-color': s[1], 'stop-opacity': s[2] }, g); return 'url(#' + id + ')'; }
function RAD(stops, cx = .36, cy = .3, r = .8) { const id = nid('r'), g = E('radialGradient', { id, cx, cy, r }, DEFS); for (const s of stops) E('stop', { offset: s[0], 'stop-color': s[1], 'stop-opacity': s[2] }, g); return 'url(#' + id + ')'; }
const FC = new Map();
// raised, lit metal: a bump from the shape's own edges, lit from the top left, with a drop shadow under it
function bevel(light, exp, scale, k3, blur = 1.3) {
  const key = 'b' + [light, exp, scale, k3, blur].join(); if (FC.has(key)) return FC.get(key);
  const id = nid('bv'), f = E('filter', { id, x: '-25%', y: '-25%', width: '150%', height: '150%', 'color-interpolation-filters': 'sRGB' }, DEFS);
  E('feGaussianBlur', { in: 'SourceAlpha', stdDeviation: blur, result: 'b' }, f);
  const sp = E('feSpecularLighting', { in: 'b', surfaceScale: scale, specularConstant: 1.05, specularExponent: exp, 'lighting-color': light, result: 's' }, f);
  E('fePointLight', { x: -40, y: -80, z: 150 }, sp);
  E('feComposite', { in: 's', in2: 'SourceAlpha', operator: 'in', result: 's2' }, f);
  E('feComposite', { in: 'SourceGraphic', in2: 's2', operator: 'arithmetic', k1: 0, k2: 1, k3, k4: 0, result: 'lit' }, f);
  E('feDropShadow', { in: 'lit', dx: 0, dy: 2.5, stdDeviation: 2.2, 'flood-color': '#000', 'flood-opacity': .75 }, f);
  const u = 'url(#' + id + ')'; FC.set(key, u); return u;
}
function glow(color, std = 3, op = .55) {
  const key = 'g' + [color, std, op].join(); if (FC.has(key)) return FC.get(key);
  const id = nid('gl'), f = E('filter', { id, x: '-40%', y: '-40%', width: '180%', height: '180%' }, DEFS);
  E('feGaussianBlur', { in: 'SourceGraphic', stdDeviation: std, result: 'b' }, f);
  E('feFlood', { 'flood-color': color, 'flood-opacity': op }, f);
  E('feComposite', { in2: 'b', operator: 'in', result: 'g' }, f);
  const m = E('feMerge', {}, f); E('feMergeNode', { in: 'g' }, m); E('feMergeNode', { in: 'SourceGraphic' }, m);
  const u = 'url(#' + id + ')'; FC.set(key, u); return u;
}
const hexA = (h, a) => { const n = parseInt(h.slice(1), 16); return 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')'; };

// ---- metals and materials ----
const MAT = {};
const mat = (n, stops, edge, hi, lo, light, exp, scale, k3, band) => (MAT[n] = { fill: LIN(stops), edge, hi, lo, bv: bevel(light, exp, scale, k3), band });
mat('gold', [[0, '#fff4c4'], [.18, '#f0c862'], [.38, '#a8701e'], [.55, '#f7dc8c'], [.76, '#b98228'], [1, '#6e4510']], '#3b2507', '#fff3c8', '#4a3008', '#fff2cc', 20, 4, .85,
  'linear-gradient(90deg,#5e3a0c,#f2d488 9%,#a06a1c 20%,#fff0bd 34%,#b47c24 48%,#f4d68a 63%,#8c5a16 78%,#f0cc74 90%,#6a4210)');
mat('silver', [[0, '#ffffff'], [.2, '#dfe4ea'], [.42, '#8c949f'], [.58, '#f2f4f7'], [.8, '#9ea6b1'], [1, '#5a626d']], '#262a31', '#ffffff', '#4a515c', '#ffffff', 26, 4, .75,
  'linear-gradient(90deg,#4a515c,#e6eaef 10%,#8a929d 22%,#ffffff 36%,#99a1ac 50%,#e9ecf0 64%,#6f7782 78%,#d6dbe1 90%,#4a515c)');
mat('steel', [[0, '#eef2f7'], [.2, '#9aa3af'], [.44, '#454b55'], [.6, '#aab3bf'], [.8, '#383e47'], [1, '#727b88']], '#0a0c10', '#e9eef4', '#1a1d22', '#eef4ff', 30, 4.5, .9,
  'linear-gradient(90deg,#2a2e35,#a7b0bc 10%,#4b525c 22%,#dfe5ec 36%,#575e69 50%,#b4bcc7 64%,#3a4048 78%,#9aa3af 90%,#2a2e35)');
mat('iron', [[0, '#9aa0aa'], [.22, '#454952'], [.48, '#1b1d22'], [.68, '#5f636d'], [1, '#202228']], '#030304', '#c8ced8', '#000000', '#d8e0ea', 30, 4.5, .95,
  'linear-gradient(90deg,#141518,#5d616b 10%,#24262c 22%,#8b909a 36%,#2a2c32 50%,#6d717b 64%,#1c1d22 78%,#575b64 90%,#141518)');
mat('bronze', [[0, '#ffe2b8'], [.2, '#d49a5a'], [.42, '#7a4a1e'], [.6, '#e8b878'], [.8, '#8e5a26'], [1, '#4a2a0c']], '#2a1606', '#ffe9c8', '#3a200a', '#ffe8c8', 18, 4, .8,
  'linear-gradient(90deg,#3e220a,#d9a466 10%,#7e4c1e 22%,#f1c890 36%,#8c5826 50%,#ddae72 64%,#6a3e16 78%,#cf9a5c 90%,#3e220a)');
mat('wood', [[0, '#b07e4c'], [.28, '#6e4524'], [.5, '#946238'], [.75, '#4e3018'], [1, '#33200e']], '#1a0d04', '#e8c49a', '#24140a', '#ffe6c8', 10, 3, .42,
  'linear-gradient(90deg,#3a2410,#8e5e34 12%,#5a3a1c 26%,#a8784a 40%,#5e3e20 54%,#94643a 68%,#4a2e16 82%,#86582f 92%,#3a2410)');
mat('stone', [[0, '#d2ccbf'], [.3, '#8f897e'], [.55, '#b3ad9f'], [.8, '#6f6a61'], [1, '#4f4b44']], '#221f1b', '#f2ede2', '#3a3630', '#fffaf0', 9, 3, .45,
  'linear-gradient(90deg,#4f4b44,#aaa498 12%,#77726a 26%,#c9c3b6 40%,#7c776e 54%,#b4ae9f 68%,#66625a 82%,#a39d90 92%,#4f4b44)');
mat('leather', [[0, '#8a6040'], [.35, '#4e3220'], [.65, '#6a4429'], [1, '#2e1c10']], '#140a04', '#e8c8a8', '#1a0e06', '#ffe0c0', 8, 2.5, .35,
  'linear-gradient(90deg,#24160c,#6a4429 14%,#3e2817 30%,#7a5236 46%,#3a2414 62%,#6e482c 78%,#2e1c10)');
mat('ivory', [[0, '#fffaf0'], [.3, '#ece0c6'], [.62, '#c9b48e'], [1, '#7e6a48']], '#3a2e1a', '#ffffff', '#5a4a2e', '#ffffff', 14, 3.5, .6, '');
mat('horn', [[0, '#efe4cc'], [.4, '#a8946e'], [.75, '#5a4a32'], [1, '#2a2014']], '#140e06', '#fff6e0', '#3a2e1c', '#fff6e0', 14, 3.5, .6, '');
mat('void', [[0, '#d8c6ff'], [.25, '#6a5498'], [.5, '#261c3e'], [.75, '#7a64a8'], [1, '#1c142e']], '#07040e', '#e6dcff', '#0a0614', '#e6dcff', 26, 4, .8,
  'linear-gradient(90deg,#140e22,#6a5498 10%,#2a2040 22%,#a690d8 36%,#30264a 50%,#7a64a8 64%,#201834 78%,#5e4a8a 90%,#140e22)');
const FEA = {
  gold: { fill: LIN([[0, '#a87322'], [.45, '#f3cf78'], [1, '#fff3c8']], 0, 0, 1, 0), edge: '#4a2f08', rach: '#6b470f' },
  white: { fill: LIN([[0, '#8e98a8'], [.45, '#e6ebf2'], [1, '#ffffff']], 0, 0, 1, 0), edge: '#3a4250', rach: '#7a8494' },
  dark: { fill: LIN([[0, '#140c24'], [.5, '#3e2c66'], [1, '#9a80d8']], 0, 0, 1, 0), edge: '#05020a', rach: '#b49cff' },
};
const FADE = new Map(); const fade = (c) => { if (!FADE.has(c)) FADE.set(c, LIN([[0, c, 0], [.22, c, 1], [.78, c, 1], [1, c, 0]], 0, 0, 1, 0)); return FADE.get(c); };

// ---- parts ----
function sym(id, vb) { return E('symbol', { id, viewBox: vb, overflow: 'visible' }, DEFS); }
// (an arm: drawn along the top edge, and the same part turned for the left edge)
function arm(parent, draw, filter) { const g = E('g', { id: nid('a'), filter }, parent); draw(g); E('use', { href: '#' + g.id, transform: 'matrix(0 1 1 0 0 0)' }, parent); return g; }
// (a crest's left half, and the same mirrored for the right)
function halves(parent, draw, filter) { const g = E('g', { id: nid('h'), filter }, parent); draw(g); E('use', { href: '#' + g.id, transform: 'matrix(-1 0 0 1 320 0)' }, parent); return g; }
function feather(g, B, T, w, s, pal) {
  const dx = T[0] - B[0], dy = T[1] - B[1], L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L, nx = -uy * s, ny = ux * s;
  const M = [B[0] + dx * .5, B[1] + dy * .5], c1 = [M[0] + nx * w, M[1] + ny * w], c2 = [M[0] - nx * w * .4, M[1] - ny * w * .4];
  E('path', { d: 'M' + P(...B) + ' Q' + P(...c1) + ' ' + P(...T) + ' Q' + P(...c2) + ' ' + P(...B) + ' Z', fill: pal.fill, stroke: pal.edge, 'stroke-width': .8, 'stroke-linejoin': 'round' }, g);
  const q = (t, k) => { const a = (1 - t) * (1 - t), b = 2 * t * (1 - t), c = t * t; return [a * B[0] + b * (M[0] + nx * w * k) + c * T[0], a * B[1] + b * (M[1] + ny * w * k) + c * T[1]]; };
  E('path', { d: 'M' + P(...B) + ' Q' + P(M[0] + nx * w * .25, M[1] + ny * w * .25) + ' ' + P(...T), fill: 'none', stroke: pal.rach, 'stroke-width': .8, opacity: .85 }, g);
  for (const t of [.24, .36, .48, .6, .72, .84]) { const a = q(t, .25), b = q(t + .07, .95); E('path', { d: 'M' + P(...a) + ' L' + P(...b), stroke: pal.rach, 'stroke-width': .5, opacity: .55 }, g); }
}
function spikes(g, cx, cy, r1, rL, rS, n, hwL, hwS, M, off = -Math.PI / 2) {
  for (let i = 0; i < n; i++) { const a = off + i * 2 * Math.PI / n, lg = i % 2 === 0, r2 = lg ? rL : rS, hw = (lg ? hwL : hwS) * Math.PI / 180;
    E('path', { d: 'M' + P(cx + r1 * Math.cos(a - hw), cy + r1 * Math.sin(a - hw)) + ' L' + P(cx + r2 * Math.cos(a), cy + r2 * Math.sin(a)) + ' L' + P(cx + r1 * Math.cos(a + hw), cy + r1 * Math.sin(a + hw)) + ' Z',
      fill: M.fill, stroke: M.edge, 'stroke-width': .7, 'stroke-linejoin': 'round' }, g); } }
function starPoly(cx, cy, ro, ri, n, off = -Math.PI / 2) { const pts = []; for (let i = 0; i < n * 2; i++) { const a = off + i * Math.PI / n, r = i % 2 ? ri : ro; pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); } return poly(pts); }
const star4 = (x, y, s) => starPoly(x, y, s, s * .28, 4);
function rivet(g, x, y, r, M) { E('circle', { cx: x, cy: y, r, fill: M.fill, stroke: M.edge, 'stroke-width': .8 }, g); E('circle', { cx: x - r * .3, cy: y - r * .3, r: r * .35, fill: '#fff', opacity: .5 }, g); }
function gemRound(g, cx, cy, r, T) {
  E('circle', { cx, cy, r: r + 1.3, fill: '#0c0704' }, g); E('circle', { cx, cy, r, fill: T.gFill }, g);
  E('path', { d: poly([[cx, cy - r], [cx + r * .7, cy], [cx, cy + r], [cx - r * .7, cy]]), fill: '#fff', opacity: .08 }, g);
  E('ellipse', { cx: f2(cx - r * .36), cy: f2(cy - r * .42), rx: f2(r * .4), ry: f2(r * .21), fill: '#fff', opacity: .85, transform: 'rotate(-35 ' + P(cx - r * .36, cy - r * .42) + ')' }, g);
  E('path', { d: star4(cx + r * .4, cy + r * .36, r * .3), fill: '#fff', opacity: .9 }, g);
}
function gemCut(g, cx, cy, r, T, n = 6, rot = Math.PI / 6) {
  const pts = [...Array(n)].map((_, i) => { const a = rot + i * 2 * Math.PI / n; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; });
  E('path', { d: poly(pts), fill: '#0c0406', stroke: '#0c0406', 'stroke-width': 2.4, 'stroke-linejoin': 'round' }, g);
  pts.forEach((p, i) => { const q = pts[(i + 1) % n]; E('path', { d: poly([[cx, cy], p, q]), fill: T.facets[i % T.facets.length] }, g); });
  const tb = pts.map(([x, y]) => [cx + (x - cx) * .46, cy + (y - cy) * .46]);
  E('path', { d: poly(tb), fill: T.gem[1], opacity: .85 }, g); E('path', { d: poly(tb), fill: 'none', stroke: '#fff', 'stroke-width': .5, opacity: .5 }, g);
  E('ellipse', { cx: f2(cx - r * .3), cy: f2(cy - r * .35), rx: f2(r * .3), ry: f2(r * .16), fill: '#fff', opacity: .8, transform: 'rotate(-35 ' + P(cx - r * .3, cy - r * .35) + ')' }, g);
}
function shard(g, cx, cy, len, w, ang, T) {
  const h = len / 2, s = w * .55, t = E('g', { transform: 'translate(' + P(cx, cy) + ') rotate(' + ang + ')' }, g);
  E('path', { d: poly([[0, -h], [w / 2, -h + s], [w / 2, h - s], [0, h], [-w / 2, h - s], [-w / 2, -h + s]]), fill: '#0b0410', stroke: '#0b0410', 'stroke-width': 2, 'stroke-linejoin': 'round' }, t);
  E('path', { d: poly([[0, -h], [-w / 2, -h + s], [-w / 2, h - s], [0, h]]), fill: T.gem[1] }, t);
  E('path', { d: poly([[0, -h], [w / 2, -h + s], [w / 2, h - s], [0, h]]), fill: T.gem[2] }, t);
  E('path', { d: poly([[0, -h], [-w / 2, -h + s], [0, -h + s * 1.6], [w / 2, -h + s]]), fill: T.gem[0], opacity: .85 }, t);
  E('path', { d: poly([[0, h], [-w / 2, h - s], [0, h - s * 1.4], [w / 2, h - s]]), fill: T.gem[3], opacity: .9 }, t);
  E('path', { d: 'M0 ' + f2(-h + s * 1.6) + ' V' + f2(h - s * 1.4), stroke: '#fff', 'stroke-width': .7, opacity: .55 }, t);
}
// (engraved scrollwork along an edge: a cut line, its lit lip, and dots in the curls)
function filigree(g, x0, x1, y, M) {
  const p = 9, a = 2.6; let d = 'M' + x0 + ' ' + y, k = 0;
  for (let x = x0; x + p <= x1; x += p, k++) { const s = k % 2 ? 1 : -1; d += ' c' + f2(p * .3) + ' ' + f2(s * a) + ' ' + f2(p * .7) + ' ' + f2(s * a) + ' ' + p + ' 0'; }
  E('path', { d, fill: 'none', stroke: M.lo, 'stroke-width': .9, opacity: .75 }, g); E('path', { d, fill: 'none', stroke: M.hi, 'stroke-width': .5, opacity: .5, transform: 'translate(0 1)' }, g);
  for (let i = 0; i < k; i++) E('circle', { cx: f2(x0 + p * (i + .5)), cy: f2(y + (i % 2 ? 1 : -1) * a * 1.25), r: .9, fill: M.lo, opacity: .7 }, g);
}
function leaf(g, x, y, ang, len, wid, LV) {

  ['SHAMAN', 'Shaman', '#0070DD', 'stone', 'Carved stone and totem wood, elemental orbs and a thunderbird crest.', [
    [262, 'Elemental', 'STORM', { motif: 'lightning' }, 'Storm blue and lightning.'], [263, 'Enhancement', 'FLAME', { motif: 'flames' }, 'Fiery orange and flames.'], [264, 'Restoration', 'WATER', { motif: 'water' }, 'Sea teal and waves.']]],
  ['WARLOCK', 'Warlock', '#8788EE', 'iron', 'Black iron with glowing cracks, ram horns, chains and a soul shard.', [
    [265, 'Affliction', 'AFFL', {}, 'Shadow purple.'], [266, 'Demonology', 'FEL', {}, 'Fel green.'], [267, 'Destruction', 'DESTRO', {}, 'Chaos fire.']]],
  ['WARRIOR', 'Warrior', '#C69B6D', 'steel', 'Heavy riveted steel, a bronze shield boss and a heraldic shield.', [
    [71, 'Arms', 'ARMS', { cloth: CLOTH.red, motif: 'swords' }, 'Blood red, with crossed swords.'], [72, 'Fury', 'FURY', { cloth: CLOTH.orange, motif: 'axes' }, 'Rage orange, with crossed axes.'],
    [73, 'Protection', 'SAPPHIRE', { cloth: CLOTH.blue, motif: 'shield' }, 'Shield blue, with a bigger shield.']]],
];
function tint(gem, extra) { const T = Object.assign({ gem }, extra); T.gFill = RAD([[0, gem[0]], [.28, gem[1]], [.68, gem[2]], [1, gem[3]]]); T.facets = [gem[1], gem[2], gem[3], gem[2], gem[1], gem[0]]; T.glow = gem[1]; return T; }

// ---- build every spec's ornaments and its card ----
const gal = document.getElementById('gallery'), nav = document.getElementById('nav'); let n = 0;
for (const [key, cname, ccol, mname, about, specs] of CLASSES) {
  nav.insertAdjacentHTML('beforeend', '<a href="#c-' + key + '" style="--cc:' + ccol + '">' + cname + '</a>');
  const sec = document.createElement('section'); sec.className = 'cls'; sec.id = 'c-' + key; sec.style.setProperty('--cc', ccol);
  sec.innerHTML = '<div class="cls-h"><h2>' + cname + '</h2><span>' + about + '</span></div><div class="grid"></div>'; gal.appendChild(sec);
  const grid = sec.querySelector('.grid');
  for (const [sid, sname, gk, extra, note] of specs) {
    const T = tint(G4[gk], extra), ids = { corner: 'k' + sid + 'c', crest: 'k' + sid + 'r', clasp: 'k' + sid + 'p' };
    try { B[key](T, ids); } catch (e) { console.error(key, sname, e); }
    const M = MAT[extra.mat || mname], o = (c, i) => '<svg class="orn ' + c + '"><use href="#' + i + '"/></svg>';
    const card = document.createElement('div'); card.className = 'card';
    card.style.cssText = '--band:' + M.band + ';--fbg:radial-gradient(90% 70% at 50% -5%, ' + hexA(T.glow, .14) + ', transparent 60%), linear-gradient(180deg, #16151a, #0e0f13);--fl2:' + hexA(T.glow, .45) + ';--acc:' + T.gem[1] + ';--accg:' + hexA(T.glow, .45);
    card.innerHTML = o('corner tl', ids.corner) + o('corner tr', ids.corner) + o('corner bl', ids.corner) + o('corner br', ids.corner) + o('crest', ids.crest) + o('clasp l', ids.clasp) + o('clasp r', ids.clasp) + o('clasp b', ids.clasp) +
      '<div class="in"><img src="https://wow.zamimg.com/images/wow/icons/large/' + ICON[sid] + '.jpg" alt="" onerror="this.style.visibility=\'hidden\'"><div><h3>' + sname + ' ' + cname + '</h3><div class="th">' + note + '</div><div class="mini"><b>' + (84 + (n++ * 7) % 14) + '</b> out of 100</div></div></div>';
    grid.appendChild(card);
  }
}
// (one class at a time, picked from the names at the top; "All" shows every class)
nav.insertAdjacentHTML('beforeend', '<a href="#" data-k="all" style="--cc:#e6b450">All</a>');
nav.querySelectorAll('a').forEach((a) => { if (!a.dataset.k) a.dataset.k = a.getAttribute('href').slice(3); a.onclick = (e) => { e.preventDefault(); show(a.dataset.k); }; });
window.show = (k) => { for (const s of document.querySelectorAll('.cls')) s.style.display = k === 'all' || s.id === 'c-' + k ? '' : 'none'; nav.querySelectorAll('a').forEach((a) => a.classList.toggle('on', a.dataset.k === k)); window.scrollTo(0, 0); };
show('PALADIN');
</script>

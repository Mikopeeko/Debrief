<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WoW Log Analyzer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f1117; --panel: #171a22; --raised: #1e222c; --line: #2a2f3b; --line2: #353b49;
  --text: #ece8df; --muted: #98a0ad; --faint: #6c7381;
  --gold: #e6b450; --gold-ink: #1b1406; --bad: #e5534b; --bad-bg: #3a1d1d; --warn: #e8a23a; --warn-bg: #3a2c16;
  --good: #45c15c; --good-bg: #17301e; --blue: #6aa8ff;
  --r: 10px; --head: 'Barlow Semi Condensed', 'Arial Narrow', system-ui, sans-serif; --body: 'Barlow', 'Segoe UI', system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.5 var(--body); }
button, input, select { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 4px; }
.app { display: grid; grid-template-columns: 290px 1fr; height: 100vh; }
.side { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.brand { padding: 16px 16px 12px; }
.brand h1 { font: 700 21px/1.1 var(--head); margin: 0; letter-spacing: .2px; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.actions { display: flex; gap: 8px; padding: 0 16px 12px; flex-wrap: wrap; }
.actions .btn { padding: 7px 11px; }
.btn { background: var(--raised); border: 1px solid var(--line2); border-radius: 8px; padding: 7px 12px; cursor: pointer; }
.btn:hover { border-color: var(--faint); }
.btn.primary { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); font-weight: 600; }
.progress { height: 3px; background: var(--line); margin: 0 16px 10px; border-radius: 2px; overflow: hidden; display: none; }
.progress div { height: 100%; width: 0; background: var(--gold); transition: width .15s; }
.list { overflow-y: auto; padding: 0 8px 16px; flex: 1; }
.group { margin-top: 12px; }
.group > h2 { font: 600 13px var(--head); color: var(--muted); margin: 8px 8px 4px; letter-spacing: .3px; }
.bossname { font: 600 15px var(--head); margin: 10px 8px 4px; }
.pull { width: 100%; display: grid; grid-template-columns: 26px 1fr auto auto; gap: 8px; align-items: center; text-align: left;
  background: none; border: 0; border-radius: 7px; padding: 6px 8px; cursor: pointer; font-size: 14px; }
.pull:hover { background: var(--raised); }
.pull.sel { background: #2a2618; box-shadow: inset 2px 0 0 var(--gold); }
.pull .n { color: var(--faint); font-variant-numeric: tabular-nums; }
.pull .d { color: var(--muted); font-variant-numeric: tabular-nums; }
.chip { font-size: 12px; border-radius: 5px; padding: 1px 7px; font-weight: 500; white-space: nowrap; }
.chip.kill { background: var(--good-bg); color: #7ee08f; }
.chip.wipe { background: var(--bad-bg); color: #ff8f87; }
.chip.other { background: var(--raised); color: var(--muted); }
main { min-width: 0; overflow-y: auto; }
.fight { padding: 22px 28px 0; display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.fight h2 { font: 700 34px/1 var(--head); margin: 0; }
.fight .meta { color: var(--muted); margin-top: 6px; }
.fight .res { margin-left: auto; font: 600 18px var(--head); padding: 6px 14px; border-radius: 8px; }
.tabs { display: flex; gap: 2px; padding: 16px 28px 0; border-bottom: 1px solid var(--line); overflow-x: auto; position: sticky; top: 0; background: var(--bg); z-index: 5; }
.tab { background: none; border: 0; padding: 10px 14px; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; font-weight: 500; }
.tab:hover { color: var(--text); }
.tab.on { color: var(--text); border-bottom-color: var(--gold); }
.tab .cnt { font-size: 12px; background: var(--bad-bg); color: #ff8f87; border-radius: 9px; padding: 0 6px; margin-left: 5px; }
#view { padding: 22px 28px 60px; max-width: 1180px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 18px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.tile .l { color: var(--muted); font-size: 13px; }
.tile .v { font: 700 28px/1.15 var(--head); font-variant-numeric: tabular-nums; }
.tile .s { color: var(--faint); font-size: 13px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; margin-bottom: 14px; }
.panel h3 { font: 600 18px var(--head); margin: 0 0 10px; display: flex; align-items: baseline; gap: 10px; }
.panel h3 small { font: 400 13px var(--body); color: var(--muted); }
.ins { list-style: none; margin: 0; padding: 0; }
.ins li { padding: 7px 0 7px 14px; border-top: 1px solid var(--line); position: relative; }
.ins li:first-child { border-top: 0; }
.ins li::before { content: ''; position: absolute; left: 0; top: 15px; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
.ins li.death::before, .ins li.warn::before { background: var(--bad); }
.ins li.good::before { background: var(--good); }
.chart { position: relative; height: 260px; }
.chart canvas { width: 100%; height: 100%; display: block; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.tip { position: absolute; pointer-events: none; background: #0b0d12; border: 1px solid var(--line2); border-radius: 8px; padding: 8px 10px; font-size: 13px; display: none; white-space: nowrap; z-index: 3; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.pill { background: none; border: 1px solid var(--line2); color: var(--muted); border-radius: 999px; padding: 4px 13px; cursor: pointer; }
.pill.on { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); font-weight: 600; }
.who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.av { width: 34px; height: 34px; border-radius: 50%; border: 2px solid; flex: none; background: var(--raised); overflow: hidden; }
.av img { width: 100%; height: 100%; display: block; }
.av.sm { width: 24px; height: 24px; border-width: 1.5px; }
.nm { font-weight: 600; }
.sub { color: var(--muted); font-size: 13px; }
.card { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid; border-radius: 0 var(--r) var(--r) 0; margin-bottom: 10px; }
.card > summary { list-style: none; cursor: pointer; padding: 12px 14px; display: flex; align-items: center; gap: 10px; }
.card > summary::-webkit-details-marker { display: none; }
.card .body { padding: 0 14px 6px; }
.badge { margin-left: auto; font-size: 12px; border-radius: 6px; padding: 2px 8px; white-space: nowrap; }
.b-high { background: var(--bad-bg); color: #ff8f87; } .b-med { background: var(--warn-bg); color: #f3c06a; } .b-low { background: var(--raised); color: var(--muted); } .b-good { background: var(--good-bg); color: #7ee08f; }
.mrow { display: grid; grid-template-columns: 1fr 4px; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.mrow .t { color: var(--faint); font-variant-numeric: tabular-nums; margin-left: 6px; }
.mrow .fx { color: var(--muted); font-size: 14px; }
.sev { border-radius: 2px; }
.sev.High { background: var(--bad); } .sev.Medium { background: var(--warn); } .sev.Low { background: var(--faint); }
.sp { text-decoration: none; font-weight: 500; }
.icw { position: relative; display: inline-block; width: 20px; height: 20px; vertical-align: -5px; margin-right: 7px; flex: none; }
.icw.big { width: 30px; height: 30px; vertical-align: -10px; margin-right: 10px; }
.icw .ico { width: 100%; height: 100%; margin: 0; vertical-align: top; }
.icw img.oi { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 4px; opacity: 0; box-shadow: 0 0 0 1px #000, 0 0 0 2px #3a3f4d; }
.icw.has img.oi { opacity: 1; } .icw.has svg { visibility: hidden; }
.stk .shn .icw { display: block; margin: 0 auto 3px; width: 18px; height: 18px; }
.av { position: relative; overflow: hidden; }
.av img.oi { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 50%; opacity: 0; transform: scale(1.12); }
.av.has img.oi { opacity: 1; } .av.has svg { visibility: hidden; }
.dchip .icw { display: none; }
.ico { width: 20px; height: 20px; vertical-align: -5px; margin-right: 7px; flex: none; filter: drop-shadow(0 1px 1px rgba(0,0,0,.6)); }
.ico.big { width: 30px; height: 30px; vertical-align: -10px; margin-right: 10px; }
.ico .gl { fill: none; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.av svg { width: 100%; height: 100%; display: block; }
.av .gl.em { fill: none; stroke: currentColor; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; }
.av { background: radial-gradient(circle at 35% 30%, #2a2f3c, #14171e); display: inline-block; }
.sp:hover { text-decoration: underline; }
.meters { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.mrowp { display: flex; align-items: center; gap: 10px; padding: 6px 8px; margin: 0 -8px; border-radius: 7px; cursor: pointer; border: 0; background: none; width: calc(100% + 16px); text-align: left; }
.mrowp:hover { background: var(--raised); }
.mrowp.sel { background: #2a2618; }
.mrowp .main { flex: 1; min-width: 0; }
.line1 { display: flex; justify-content: space-between; gap: 8px; }
.line1 .val { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.bar { height: 7px; border-radius: 4px; background: var(--line); margin-top: 4px; overflow: hidden; display: flex; }
.bar div { height: 100%; }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; color: var(--muted); font-weight: 500; padding: 6px 6px; border-bottom: 1px solid var(--line); }
.tbl td { padding: 7px 6px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.tbl .r { text-align: right; }
.drow { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.pips { display: flex; gap: 3px; }
.pips i { width: 11px; height: 11px; border-radius: 2px; background: var(--line2); display: block; }
.pips i.on { background: var(--good); }
.note { background: #2a1a1a; color: #ffb3ad; border-radius: 8px; padding: 9px 11px; margin: 8px 0; font-size: 14px; }
.recap { font-size: 14px; }
.scroll { overflow-x: auto; }
.paste { display: flex; gap: 8px; margin: 14px 0 6px; } .paste input { flex: 1; background: var(--raised); border: 1px solid var(--line2); border-radius: 8px; padding: 10px 12px; color: var(--text); font-size: 15px; }
.fld { display: block; margin: 10px 0; color: var(--muted); font-size: 14px; }
.fld input { display: block; width: 100%; margin-top: 4px; background: var(--raised); border: 1px solid var(--line2); border-radius: 8px; padding: 8px 10px; color: var(--text); }
.chk { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 14px; margin: 6px 0 14px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.mrowm { border-radius: 8px; padding-left: 6px; margin-left: -6px; }
.mrowm:hover { background: var(--raised); }
.mrowm.on { background: #2a1a1a; box-shadow: inset 2px 0 0 var(--bad); }
.mapwrap { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(220px, 1fr); gap: 16px; align-items: start; }
.map { width: 100%; height: auto; background: radial-gradient(circle at 50% 50%, #1b2030, #12151d); border: 1px solid var(--line); border-radius: 10px; }
.seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; margin: 4px 0 14px; flex-wrap: wrap; }
.seg button { background: none; border: 0; color: var(--muted); padding: 7px 14px; border-radius: 7px; cursor: pointer; font-weight: 500; }
.seg button:hover { color: var(--text); }
.seg button.on { background: var(--raised); color: var(--text); box-shadow: inset 0 -2px 0 var(--gold); }
.seg .n { font-size: 12px; color: var(--faint); margin-left: 4px; }
.seg .n.bad { background: var(--bad-bg); color: #ff8f87; border-radius: 9px; padding: 0 6px; }
.howto { color: var(--muted); font-size: 14px; margin: -6px 0 10px; }
.howto summary { cursor: pointer; color: var(--faint); width: max-content; }
.howto[open] summary { margin-bottom: 4px; }
.kgrid { display: grid; grid-template-columns: minmax(250px, 320px) minmax(0, 1fr); gap: 14px; align-items: start; }
.kgrid .klist { max-height: 760px; overflow-y: auto; }
.kgrid .mapwrap { grid-template-columns: 1fr; }
.tbl tr.badrow td { background: #241818; } .tbl td.hotv { color: #ff8f87; font-weight: 600; }
@media (max-width: 1100px) { .kgrid { grid-template-columns: 1fr; } }
.mapctl { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin: 0 0 12px; font-size: 14px; }
.mapctl label { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); }
.mapctl input[type=range] { accent-color: var(--gold); width: 120px; }
.map.aligning { cursor: move; outline: 2px dashed var(--gold); outline-offset: 2px; touch-action: none; }
.map .mg { stroke: #232838; stroke-width: 1; opacity: .6; }
.map .floor { filter: blur(1.5px); }
.map .floor rect { fill: #39425a; }
.map .rng { fill: rgba(229,83,75,.05); stroke: #e5534b; stroke-opacity: .45; stroke-dasharray: 6 6; }
.map .kl { stroke: #e6b450; stroke-width: 1.5; stroke-dasharray: 4 3; }
.map .kd { fill: #e6b450; font-size: 12px; text-anchor: middle; font-weight: 600; }
.map .boss { fill: #3a3016; stroke: #e6b450; stroke-width: 2.5; }
.map .oadd { fill: #4a5163; stroke: #8a92a6; }
.map .oadd.rec { fill: #8a6a2a; stroke: #e6b450; stroke-width: 2; }
.map .oadd.stale { stroke-dasharray: 3 2; fill-opacity: .55; }
.map .ml.rec { fill: #f3c06a; }
.mapbox { position: relative; }
.maptip { position: absolute; display: none; pointer-events: none; z-index: 5; background: #0b0d12; border: 1px solid var(--line2); border-radius: 8px; padding: 8px 11px; font-size: 13px; line-height: 1.55; min-width: 210px; max-width: 300px; box-shadow: 0 6px 20px rgba(0,0,0,.5); }
.maptip .tt-h { font-size: 14px; margin-bottom: 2px; } .maptip .tt-dim { color: var(--muted); } .maptip .tt-ok { color: #7ee08f; font-weight: 600; }
.maptip .tt-bad { color: #ff8f87; font-weight: 600; } .maptip .tt-gold { color: #f3c06a; font-weight: 600; }
.maptip .icw { width: 16px; height: 16px; vertical-align: -3px; margin-right: 5px; }
.map circle.pl { cursor: pointer; }
.np .npbg { fill: rgba(11,13,18,.88); stroke: #3a3f4d; }
.np.hot .npbg { stroke: #e5534b; stroke-width: 1.5; } .np.rec .npbg { stroke: #e6b450; } .np.bs .npbg { stroke: #e6b450; }
.np .npt { fill: #ece8df; font-size: 11.5px; font-weight: 600; }
.np.hot .npt { fill: #ff8f87; } .np.rec .npt { fill: #f3c06a; } .np.dim .npt { fill: #aab1c0; font-weight: 500; }
.np .nphb { fill: #2a2f3b; } .np .nphp { fill: #c0392b; } .np.bs .nphp { fill: #d9a33a; }
.map [data-tip] { cursor: pointer; }
.addn .mk, .mrowm .mk, td .mk { vertical-align: -3px; margin-right: 5px; }
.addgrp { margin-bottom: 18px; } .addgrp > .line1 { margin-bottom: 4px; }
.tbl tr.wv td { background: var(--raised); color: var(--text); font-weight: 600; font-size: 13px; padding: 5px 6px; }
.maptip .mk { vertical-align: -2px; }
#sptip { position: fixed; display: none; z-index: 50; pointer-events: none; width: max-content; max-width: 340px; background: #0b0d12; border: 1px solid #4a4f5e; border-radius: 9px; padding: 10px 12px; font-size: 13px; line-height: 1.5; box-shadow: 0 10px 30px rgba(0,0,0,.6); }
#sptip .spt-h { display: flex; gap: 2px; align-items: center; font-size: 14px; margin-bottom: 6px; }
#sptip .spt-s { font-size: 12px; color: var(--muted); font-weight: 400; }
#sptip .spt-b.wh { color: #ece8df; } #sptip .spt-b.wh table { border-collapse: collapse; } #sptip .spt-b.wh td, #sptip .spt-b.wh th { padding: 0; vertical-align: top; }
#sptip .spt-b.wh .q, #sptip .spt-b.wh .whtt-sellprice { color: #ffd100; } #sptip .spt-b.wh .q1, #sptip .spt-b.wh .whtt-extra { color: #fff; }
#sptip .spt-b.wh br + br { display: none; } #sptip .spt-b.wh b { color: #fff; }
#sptip .spt-f { margin-top: 6px; font-size: 11px; color: var(--faint); }
.pbar { position: relative; margin-top: 6px; }
.pbar .phs { position: relative; height: 30px; border-radius: 6px; overflow: hidden; background: var(--line); }
.pbar .ph { position: absolute; top: 0; bottom: 0; border-right: 2px solid var(--panel); display: flex; align-items: center; padding-left: 8px; overflow: hidden; }
.pbar .ph span { font-size: 12px; font-weight: 600; white-space: nowrap; color: #ece8df; }
.pbar .pms { position: relative; height: 100px; margin-top: 6px; border-bottom: 1px solid var(--line); }
.pbar .pm { position: absolute; transform: translateX(-50%); }
.pbar .pm .icw { margin: 0; width: 20px; height: 20px; }
.pbar .pds { position: relative; height: 12px; }
.pbar .pd { position: absolute; top: 2px; width: 3px; height: 9px; background: var(--bad); border-radius: 1px; transform: translateX(-50%); }
.pbar .ptks { position: relative; height: 16px; }
.pbar .ptk { position: absolute; transform: translateX(-50%); font-size: 11px; color: var(--faint); }
.mmb { padding: 2px 10px; font-size: 13px; }
.mm:empty { display: none; } .mm { margin-top: 10px; }
.tlink { text-decoration: none; color: inherit; } .tlink:hover { border-color: var(--line2); }
.tlink .l .icw { width: 16px; height: 16px; vertical-align: -3px; margin-right: 6px; }
.who.sm { display: inline-flex; gap: 6px; } .who.sm .av { width: 22px; height: 22px; }
.hotv { color: #ff8f87; font-weight: 600; }
.chips { display: inline-flex; flex-wrap: wrap; gap: 4px 12px; }
.chipn { display: inline-flex; align-items: center; gap: 6px; background: var(--raised); border-radius: 999px; padding: 2px 10px 2px 3px; } .tc { font-variant-numeric: tabular-nums; color: var(--muted); }
.maplegend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); margin: 8px 0; }
.maplegend .lg { display: inline-block; width: 10px; height: 10px; transform: rotate(45deg); margin-right: 7px; vertical-align: 0; border: 1.5px solid; }
.maplegend .lg.madd { background: #e5534b; border-color: #fff; } .maplegend .lg.rec { background: #8a6a2a; border-color: #e6b450; }
.maplegend .lg.oadd { background: #4a5163; border-color: #8a92a6; } .maplegend .lg.boss { background: #3a3016; border-color: #e6b450; border-radius: 50%; transform: none; }
.map .madd { fill: #e5534b; stroke: #fff; stroke-width: 2; }
.map .pl { stroke: #0f1117; stroke-width: 1.5; }
.map .pl.k { stroke: #fff; stroke-width: 2.5; }
.map .ml { fill: #ece8df; font-size: 12px; text-anchor: middle; font-weight: 600; paint-order: stroke; stroke: #0f1117; stroke-width: 3px; }
.map .ml.dim { fill: #8a92a6; font-weight: 500; } .map .ml.hot { fill: #ff8f87; font-size: 13px; }
.map .scale { stroke: #ece8df; stroke-width: 2; }
@media (max-width: 900px) { .mapwrap { grid-template-columns: 1fr; } }
.dchip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: #ff8f87; background: var(--bad-bg); border-radius: 5px; padding: 1px 7px 1px 4px; margin-left: 6px; vertical-align: 1px; }
.dchip { cursor: pointer; }
.dchip:hover { background: #4a2222; text-decoration: underline; }
.dchip svg { width: 14px; height: 14px; }
.dchip .gl { fill: none; stroke: #ff8f87; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }
.stk th, .stk td { white-space: nowrap; }
.stk td.pn .av, .stk td.pn .nm { vertical-align: middle; }
.stk td.pn { position: sticky; left: 0; background: var(--panel); z-index: 1; }
.stk th.sh { vertical-align: bottom; text-align: center; min-width: 92px; white-space: normal; }
.stk .shn { font-size: 13px; line-height: 1.25; margin-bottom: 4px; }
.stk .shn .ico { width: 18px; height: 18px; display: block; margin: 0 auto 3px; }
.stk td.sc { text-align: center; padding: 4px; }

function parseTs(line) {
  const i = line.indexOf('  ');
  if (i < 8 || i > 40) return null;
  const sp = line.indexOf(' ');
  const d = line.substring(0, sp).split('/');
  let t = line.substring(sp + 1, i);
  const tz = Math.max(t.lastIndexOf('-'), t.lastIndexOf('+'));
  if (tz > 0) t = t.substring(0, tz);
  const p = t.split(/[:.]/);
  if (d.length !== 3 || p.length < 3) return null;
  const ms = p.length > 3 ? parseInt((p[3] + '000').substring(0, 3), 10) : 0;
  const v = Date.UTC(+d[2], +d[0] - 1, +d[1], +p[0], +p[1], +p[2], ms);
  return v === v ? { ms: v, body: i + 2 } : null;
}

function split(s, start) {
  const res = [];
  let seg = start, q = false, depth = 0;
  for (let i = start; i < s.length; i++) {
    const c = s.charCodeAt(i);
    if (c === 34) { q = !q; continue; }
    if (q) continue;
    if (c === 40 || c === 91) depth++;
    else if (c === 41 || c === 93) depth--;
    else if (c === 44 && depth === 0) { res.push(unq(s.substring(seg, i))); seg = i + 1; }
  }
  res.push(unq(s.substring(seg)));
  return res;
}
function unq(x) { return x.charCodeAt(0) === 34 && x.length > 1 ? x.slice(1, -1) : x; }

// ---------- indexing: find pulls and keys by byte offset ----------
function createIndexer() {
  const bosses = [], runs = [], pulls = {};
  let cur = null, run = null, lastMs = 0;
  return {
    line(text, start, end) {
      const ts = parseTs(text); if (!ts) return;
      lastMs = ts.ms;
      const c = text.indexOf(',', ts.body); if (c < 0) return;
      const ev = text.substring(ts.body, c);
      const f = split(text, c + 1);
      if (ev === 'ENCOUNTER_START' && f.length >= 4) {
        if (cur) { cur.endByte = start; cur.result = 'Unknown'; }
        const diffId = +f[2];
        cur = { kind: 'boss', id: +f[0], boss: f[1], diffId, diff: DIFF[diffId] || ('Difficulty ' + diffId), size: +f[3],
          startMs: ts.ms, startByte: start, endByte: 0, kill: false, result: 'In progress', duration: 0, pull: 1, run: run };
        if (run) { run.bosses.push(cur); cur.diff = run.level ? '+' + run.level : cur.diff; }
        else { const k = cur.id + ':' + diffId; pulls[k] = (pulls[k] || 0) + 1; cur.pull = pulls[k]; bosses.push(cur); }
      } else if (ev === 'ENCOUNTER_END' && cur && +f[0] === cur.id) {
        cur.kill = f[4] === '1'; cur.result = cur.kill ? 'Kill' : 'Wipe';
        cur.duration = num(f[5]) / 1000; cur.endByte = end; cur = null;
      } else if (ev === 'CHALLENGE_MODE_START') {
        run = { kind: 'run', boss: f[0], zone: f[0], level: +f[3], diff: '+' + f[3], startMs: ts.ms, startByte: start, endByte: 0,
          kill: false, result: 'In progress', duration: 0, bosses: [] };
        runs.push(run);
      } else if (ev === 'CHALLENGE_MODE_END' && run) {
        run.kill = f[1] === '1'; run.result = run.kill ? 'Timed' : 'Depleted';
        run.duration = num(f[3]) / 1000 || (ts.ms - run.startMs) / 1000; run.endByte = end; run = null;
      }
    },
    finish(size) {
      for (const x of [cur, run]) if (x && !x.endByte) { x.endByte = size; x.duration = (lastMs - x.startMs) / 1000; }
      for (const r of runs) for (const b of r.bosses) if (!b.endByte) b.endByte = r.endByte;
      return { bosses, runs };
    },
  };
}

async function indexChunks(next, total, onProgress) {
  const ix = createIndexer();

    const lim = Math.min(e - 2, s + 48);

        const k = b[i + 2];

          const tag = dec.decode(b.subarray(i + 2, Math.min(e, i + 17)));
          if (tag.startsWith('ENCOUNTER_') || tag.startsWith('CHALLENGE_MODE_')) ix.line(dec.decode(b.subarray(s, e)), off + s, off + e + 1);
        }
        return;
      }
    }
  };
  for (;;) {
    const { done, value } = await next();
    if (done) break;
    let buf = value;
    if (carry && carry.length) { const m = new Uint8Array(carry.length + value.length); m.set(carry); m.set(value, carry.length); buf = m; }
    let s = 0, nl;
    while ((nl = buf.indexOf(10, s)) !== -1) { check(buf, s, nl, offset); s = nl + 1; }
    carry = buf.subarray(s); offset += s;
    if (onProgress) onProgress(Math.min(1, offset / total));
  }
  if (carry && carry.length) check(carry, 0, carry.length, offset);
  return ix.finish(offset + (carry ? carry.length : 0));
}

// ---------- fight audit modules ----------
// A module watches a set of spells for one encounter, gets those events after parsing,
// and returns phases, a timeline, audit sections (who / when / how) and mistakes.
// Strategy source for The Coiled Altar: Method's Mythic guide and Mythic Trap (spell IDs from Method's links).
const CA_IDS = {
  'toxic deluge': 1299960, 'virulent mutation': 1310544, 'mutagenic venom': 1310498, 'venom rupture': 1299838, 'coalesced venom': 1282403,
  'sever': 1299680, 'soul sever': 1286620, 'blighted sever': 1307279, 'guillotine': 1283489, 'grim guillotine': 1299267,
  'fangs of the coiled altar': 1282487, 'dreadmarch': 1285643, 'malevolent resonance': 1310732, 'spiritcackle': 1286441,
  'wail of terror': 1286399, 'gloombomb': 1310882, 'spirit shield': 1309105, 'soulbinding': 1304032, 'spirit erasure': 1287722,
  'reclaim essence': 1287718, 'eternal nightfall': 1286918, 'defilement of the coiled altar': 1298381, 'axegrinder': 1283832, 'venomfang': 0,
};
const MODULES = [{
  encounter: 'The Coiled Altar',
  units: ["Zul'jan", 'Hex Lord Malacrass', 'Malacrass', 'Spiteful Soulcoiler', 'Fragment of Malacrass'],
  spells: Object.keys(CA_IDS).concat(['bloodlust', 'heroism', 'time warp', 'fury of the aspects', 'primal rage', "harrier's cry", 'darkness', 'spirit link totem', 'anti-magic zone', 'rallying cry', 'power word: barrier', 'aura mastery', 'tranquility', 'revival', 'rewind', 'divine hymn', 'vampiric embrace',
    'divine shield', 'ice block', 'aspect of the turtle', 'cloak of shadows', 'anti-magic shell', 'netherwalk', 'dispersion', 'blessing of spellwarding', 'blessing of protection', 'blessing of sacrifice', 'pain suppression', 'guardian spirit', 'ironbark', 'life cocoon', 'time dilation']),
  focus: new Set(["Zul'jan", 'Hex Lord Malacrass', 'Malacrass']),
  build: buildCoiledAltar,
}];

function buildCoiledAltar(ev, r, h) {
  const pl = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
  const mythic = r.item.diff === 'Mythic';
  const S = (n) => [CA_IDS[n] || 0, n.split(' ').map((w, i) => (i && (w === 'of' || w === 'the') ? w : w.charAt(0).toUpperCase() + w.slice(1))).join(' ')];
  const L = (x) => String(x).toLowerCase();
  const casts = (n) => ev.filter((e) => (e.k === 'cast' || e.k === 'start') && L(e.spell) === n).map((e) => e.t)
    .sort((a, b) => a - b).filter((t, i, a) => i === 0 || t - a[i - 1] > 3);
  const dmg = (n) => ev.filter((e) => e.k === 'dmg' && L(e.spell) === n);
  const auras = (n) => ev.filter((e) => e.k === 'aura' && L(e.spell) === n);
  const pname = (g) => h.name(g), role = (g) => h.role(g);
  const mistakes = [], sections = [], dur = r.duration;
  const M = (t, player, spell, severity, detail, fix) => mistakes.push({ t, player, mechanic: S(spell)[1], id: S(spell)[0], severity, detail, fix });

  // ---- phases ----
  const dm = casts('dreadmarch'), sb = casts('soulbinding');
  const p2 = dm.length ? dm[0] : null, inter = sb.length ? sb[0] : null;
  let p3 = null;
  if (inter != null) {
    const after = ['grim guillotine', 'blighted sever', 'defilement of the coiled altar'].flatMap((n) => casts(n)).filter((t) => t > inter + 3);
    p3 = after.length ? Math.min(...after) : null;
  }
  const phases = [{ name: 'P1 Zul\'jan', start: 0, end: p2 ?? dur }];
  if (p2 != null) phases.push({ name: 'P2 Malacrass', start: p2, end: inter ?? dur });
  if (inter != null) phases.push({ name: 'Intermission', start: inter, end: p3 ?? dur });
  if (p3 != null) phases.push({ name: 'P3 Coiled Union', start: p3, end: dur });
  const phaseAt = (t) => { let n = phases[0].name; for (const p of phases) if (t >= p.start) n = p.name; return n.split(' ')[0]; };
  const marks = [];
  for (const [n, kind] of [['toxic deluge', 'orb'], ['sever', 'front'], ['blighted sever', 'front'], ['soul sever', 'front'], ['guillotine', 'soak'], ['grim guillotine', 'soak'],
    ['dreadmarch', 'ghost'], ['spiritcackle', 'add'], ['eternal nightfall', 'shield'], ['soulbinding', 'phase'], ['defilement of the coiled altar', 'raid'], ['fangs of the coiled altar', 'raid']])
    for (const t of casts(n)) marks.push({ t, label: S(n)[1], id: S(n)[0], kind });

  // ---- 1. frontals hitting non-tanks ----
  const front = [];
  for (const n of ['sever', 'soul sever', 'blighted sever']) for (const e of dmg(n)) if (role(e.dst) !== 'tank') front.push(e);
  for (const e of front) M(e.t, pname(e.dst), L(e.spell), 'High', 'Stood in ' + e.spell + ' (tank frontal) for ' + Math.round(e.amt).toLocaleString('en-US') + ' and picked up its 200% vulnerability.', 'Only the tank belongs in front of the boss. Stay out of the cone unless you are placing orbs or ghosts for it and step out before it lands.');
  sections.push({ id: 'front', title: 'Tank frontals hitting the raid', spell: S('sever'),
    verdict: front.length ? 'bad' : 'good', summary: front.length ? pl(front.length, 'non-tank hit') + ' from Sever, Soul Sever and Blighted Sever.' : 'Only tanks were hit by the frontals.',
    cols: ['When', 'Player', 'Frontal', 'Damage'], rows: front.map((e) => [{ t: e.t }, { p: pname(e.dst) }, { s: S(L(e.spell)) }, { n: e.amt }]) });

  // ---- 2. orb cleanup: purple orb carriers, clipped players, mass ruptures, stacks at push ----
  const mv = auras('mutagenic venom').filter((e) => h.isPlayer(e.dst));
  const carry = [];
  for (const e of mv) if (e.op === 'apply') carry.push({ g: e.dst, s: e.t, e: e.t + 5 });
  for (const e of mv) if (e.op === 'remove') { const c = carry.filter((x) => x.g === e.dst && x.s <= e.t).pop(); if (c) c.e = e.t; }
  const carriersAt = (t) => carry.filter((c) => t >= c.s - 0.2 && t <= c.e + 0.3);
  const clipped = [];
  for (const e of dmg('mutagenic venom')) {
    if (carriersAt(e.t).some((c) => c.g === e.dst)) continue;
    const who = carriersAt(e.t).map((c) => pname(c.g));
    clipped.push({ ...e, who });
    M(e.t, pname(e.dst), 'mutagenic venom', 'Medium', 'Stood within 8 yards of a purple orb carrier' + (who.length ? ' (' + who.join(', ') + ')' : '') + ' and took ' + Math.round(e.amt).toLocaleString('en-US') + '.', 'Purple carriers have right of way. Give anyone carrying Mutagenic Venom at least 8 yards.');
  }
  // mass Venom Rupture: a player jumping 8+ stacks within 2s means a purple orb touched other orbs
  const vr = auras('venom rupture').filter((e) => h.isPlayer(e.dst)).sort((a, b) => a.t - b.t);
  const lastSt = new Map(), hist = new Map(), bursts = [];
  for (const e of vr) {
    let st = e.op === 'apply' ? 1 : e.op === 'dose' ? e.stacks : e.op === 'rdose' ? e.stacks : 0;
    lastSt.set(e.dst, st);
    let l = hist.get(e.dst); if (!l) hist.set(e.dst, l = []); l.push([e.t, st]);
    const early = l.find(([t]) => t >= e.t - 2);
    if (early && st - early[1] >= 8 && !bursts.some((b) => Math.abs(b.t - e.t) < 4)) bursts.push({ t: e.t, gain: st - early[1] });
  }
  for (const b of bursts) {
    const who = carriersAt(b.t).map((c) => pname(c.g));
    M(b.t, 'Raid', 'venom rupture', 'High', 'A purple orb exploded into other orbs: players gained ' + b.gain + '+ Venom Rupture stacks at once' + (who.length ? '. Carrying a purple orb at that moment: ' + who.join(', ') : '') + '.', 'Purple orbs must never touch green or purple orbs. Carriers path around every other orb.');
  }
  // Virulent Mutation left on the ground when the next Toxic Deluge goes out
  const deluges = casts('toxic deluge');
  const fangs = () => casts('fangs of the coiled altar');
  const vmHits = dmg('virulent mutation');
  const leftover = [];
  for (const d of deluges.slice(1)) {
    const hits = vmHits.filter((e) => e.t >= d && e.t <= d + 4);
    const big = new Set(hits.map((e) => e.dst));
    if (big.size >= 10) { leftover.push({ t: d, n: big.size }); M(d, 'Raid', 'virulent mutation', 'High', 'A Virulent Mutation was still on the ground when Toxic Deluge was cast and erupted on ' + big.size + ' players.', 'Every purple orb from a Deluge has to be cleared before the next one. Give each cleanup player their own section.'); }
  }
  const stackAt = (t) => { const v = []; for (const [g, l] of hist) { let s = 0; for (const [tt, st] of l) { if (tt > t) break; s = st; } if (s) v.push(s); } return v; };
  const pushStacks = p2 != null ? stackAt(p2 - 0.5) : [];
  const pushMax = pushStacks.length ? Math.max(...pushStacks) : 0;
  const carriers = new Map(); for (const c of carry) carriers.set(pname(c.g), (carriers.get(pname(c.g)) || 0) + 1);
  const cycles = deluges.map((d, i) => {
    const end = deluges[i + 1] ?? (p2 ?? dur);
    const picks = carry.filter((c) => c.s >= d && c.s < end);
    return [{ txt: '#' + (i + 1) }, { t: d }, { txt: picks.length + ' pickups' }, { ps: [...new Set(picks.map((c) => pname(c.g)))], none: 'nobody' },
      { txt: clipped.filter((c) => c.t >= d && c.t < end).length + ' clipped', bad: clipped.some((c) => c.t >= d && c.t < end) },
      { txt: leftover.some((x) => x.t === end) ? 'orb left at next Deluge' : bursts.some((b) => b.t >= d && b.t < end) ? 'orbs collided' : 'clean', bad: leftover.some((x) => x.t === end) || bursts.some((b) => b.t >= d && b.t < end) }];
  });
  sections.push({ id: 'orbs', title: 'Orb cleanup', spell: S('virulent mutation'), mythicOnly: true,
    verdict: bursts.length || leftover.length ? 'bad' : clipped.length ? 'warn' : 'good',
    summary: [pl(deluges.length, 'Toxic Deluge cycle'), pl(carry.length, 'purple orb pickup'), pl(clipped.length, 'player') + ' clipped by carriers', pl(bursts.length, 'orb collision'), pl(leftover.length, 'orb') + ' left at a Deluge'].join(', ') +
      (p2 != null ? '. Venom Rupture when P1 was pushed: up to ' + pushMax + ' stacks' + (pushMax > 12 ? ' (Method aims for 10 to 11)' : '') + '.' : '.'),
    cols: ['Cycle', 'Deluge', 'Purple pickups', 'Carriers', 'Clipped', 'Result'], rows: cycles,
    extra: carriers.size ? { title: 'Purple orb carriers', items: [...carriers].sort((a, b) => b[1] - a[1]).map(([n, c]) => ({ p: n, n: c })) } : null });

  // ---- 3. Guillotine soaks ----
  const soaks = [];
  for (const n of ['guillotine', 'grim guillotine']) {
    const hits = dmg(n);
    for (const t of casts(n)) {
      const w = hits.filter((e) => e.t >= t && e.t <= t + 8);
      const who = [...new Set(w.map((e) => e.dst))];
      const died = r.deaths.filter((d) => d.t >= (w[0] ? w[0].t : t) - 0.2 && d.t <= (w[0] ? w[0].t : t) + 4).map((d) => d.player);
      soaks.push({ n, t, who, died, hit: w[0] ? w[0].t : null });
    }
  }
  soaks.sort((a, b) => a.t - b.t);
  const need = mythic ? 6 : 5;
  soaks.forEach((s, i) => {
    if (s.who.length && s.who.length < need) M(s.t, 'Raid', s.n, s.who.length < 5 ? 'High' : 'Medium', S(s.n)[1] + ' was soaked by only ' + s.who.length + ' players (' + s.who.map(pname).join(', ') + ').', 'Send the full assigned group (Method uses 6 on Mythic, including immunities on the 2nd).');
    for (const d of s.died) M(s.t, d, s.n, 'High', 'Died in the ' + S(s.n)[1] + ' soak.', 'Soakers need a personal defensive or an immunity, and the target needs an external.');
    const prev = soaks.slice(0, i).filter((x) => s.t - x.t < 60);
    for (const g of s.who) if (prev.some((x) => x.who.includes(g))) M(s.t, pname(g), s.n, 'Medium', 'Soaked ' + S(s.n)[1] + ' again within a minute of their last soak.', 'Guillotine soaks leave a vulnerability, so use the two alternating soak groups.');
  });
  sections.push({ id: 'soaks', title: 'Guillotine soaks', spell: S('guillotine'),
    verdict: soaks.some((s) => s.died.length || (s.who.length && s.who.length < 5)) ? 'bad' : soaks.some((s) => s.who.length < need) ? 'warn' : 'good',
    summary: pl(soaks.length, 'soak') + '. Target: ' + need + ' players each' + (mythic ? ' (Method: 6, with immunities on the 2nd Guillotine and an external on the target)' : '') + '.',
    cols: ['When', 'Soak', 'Phase', 'Players', 'Soakers', 'Died'], rows: soaks.map((s) => [{ t: s.t }, { s: S(s.n) }, { txt: phaseAt(s.t) }, { txt: String(s.who.length), bad: s.who.length < need },
      { ps: s.who.map(pname), none: 'none recorded' }, { ps: s.died, none: '—', bad: true }]) });

  // ---- 4. Ghosts: Malevolent Resonance (two ghosts touching) ----
  const mr = dmg('malevolent resonance'), mrEvents = [];
  for (const e of mr) { let x = mrEvents.find((m) => Math.abs(m.t - e.t) < 2); if (!x) mrEvents.push(x = { t: e.t, who: new Set(), amt: 0 }); x.who.add(e.dst); x.amt += e.amt; }
  for (const m of mrEvents) for (const g of m.who) M(m.t, pname(g), 'malevolent resonance', 'High', 'Their ghost touched another ghost' + (m.who.size > 1 ? ' (with ' + [...m.who].filter((x) => x !== g).map(pname).join(', ') + ')' : '') + ', causing Malevolent Resonance.', 'Only you can see your ghost on Mythic. Hold it near the marker for Soul Sever and keep it away from other ghosts.');
  sections.push({ id: 'ghosts', title: 'Ghosts (Dreadmarch)', spell: S('dreadmarch'), mythicOnly: true,
    verdict: mrEvents.length ? 'bad' : 'good', summary: pl(dm.length, 'Dreadmarch cast') + ', ' + pl(mrEvents.length, 'ghost collision') + ' (Malevolent Resonance).',
    cols: ['When', 'Players whose ghosts touched', 'Damage taken'], rows: mrEvents.map((m) => [{ t: m.t }, { ps: [...m.who].map(pname) }, { n: m.amt }]) });

  // ---- 5. Spiritcackle adds and Gloombomb ----
  const sc = casts('spiritcackle');
  const adds = [];
  for (const [g, t0] of r.firstSeen) { const nm = h.unitName(g); if (nm === 'Spiteful Soulcoiler') adds.push({ g, t0, died: (ev.find((e) => e.k === 'die' && e.guid === g) || {}).t }); }
  const setRows = sc.map((t, i) => {
    const next = dm.find((x) => x > t + 5);
    const mine = adds.filter((a) => a.t0 >= t - 2 && a.t0 <= t + 15);
    const alive = next != null ? mine.filter((a) => a.died == null || a.died > next) : [];
    if (alive.length) M(next, 'Raid', 'spiritcackle', 'High', alive.length + ' Spiteful Soulcoiler' + (alive.length > 1 ? 's were' : ' was') + ' still alive when the next Dreadmarch started.', 'Break each Spirit Shield with two overlapping Gloombombs and kill both adds before 100 energy and before the next Dreadmarch.');
    const kicks = r.interrupts.filter((k) => mine.some((a) => a.g === k.target));
    return [{ txt: 'Set ' + (i + 1) }, { t }, { txt: mine.map((a) => a.died != null ? 'died ' + h.fmtT(a.died) + ' (' + Math.round(a.died - a.t0) + 's)' : 'not killed').join(', ') || 'no adds seen', bad: mine.some((a) => a.died == null) },
      { txt: String(kicks.length) }, { txt: alive.length ? 'alive at next Dreadmarch' : 'dead in time', bad: alive.length > 0 }];
  });
  const gbT = auras('gloombomb').filter((e) => e.op === 'apply' && h.isPlayer(e.dst));
  const gbClip = [];
  for (const e of dmg('gloombomb')) if (!gbT.some((a) => a.dst === e.dst && e.t - a.t >= 0 && e.t - a.t <= 10)) gbClip.push(e);
  for (const e of gbClip) M(e.t, pname(e.dst), 'gloombomb', 'Medium', 'Got clipped by someone else\'s Gloombomb, so they also had to collect souls.', 'Gloombomb targets move to the add or to the side; everyone else stays out of the circles.');
  sections.push({ id: 'adds', title: 'Spiritcackle adds and Gloombombs', spell: S('spiritcackle'),
    verdict: setRows.some((r2) => r2[4].bad) ? 'bad' : gbClip.length ? 'warn' : 'good',
    summary: pl(sc.length, 'add set') + ', ' + pl(gbClip.length, 'player') + ' clipped by a Gloombomb they weren\'t targeted by. Kick details per add are on the Interrupts tab.',
    cols: ['Set', 'Spawned', 'Adds', 'Kicks', 'Result'], rows: setRows });

  // ---- 6. Intermission: fragments reaching Zul'jan, Spirit Erasure stacks ----
  const reclaim = ev.filter((e) => (e.k === 'heal' || e.k === 'cast') && L(e.spell) === 'reclaim essence').map((e) => e.t).sort((a, b) => a - b).filter((t, i, a) => i === 0 || t - a[i - 1] > 0.5);
  for (const t of reclaim) M(t, 'Raid', 'reclaim essence', 'High', 'A Fragment of Malacrass reached Zul\'jan' + (mythic ? ' and healed him for 10%' : '') + '.', 'Soak fragments in rounds of up to 4 Spirit Erasure stacks, let them drop, repeat.');
  const se = new Map();
  for (const e of auras('spirit erasure')) if (h.isPlayer(e.dst)) se.set(e.dst, Math.max(se.get(e.dst) || 0, e.op === 'apply' ? 1 : e.stacks || 0));
  const seHigh = [...se].filter(([, s]) => s > 4);
  for (const [g, s] of seHigh) M(inter ?? 0, pname(g), 'spirit erasure', s >= 7 ? 'High' : 'Low', 'Reached ' + s + ' Spirit Erasure stacks during the intermission.', 'Stop at 4 stacks and let them drop before soaking more.');
  if (inter != null) sections.push({ id: 'inter', title: 'Intermission: Fragments of Malacrass', spell: S('soulbinding'),
    verdict: reclaim.length ? 'bad' : seHigh.length ? 'warn' : 'good',
    summary: pl(reclaim.length, 'fragment') + ' reached Zul\'jan. ' + pl(se.size, 'player') + ' soaked; ' + seHigh.length + ' went past 4 stacks.',
    cols: ['Player', 'Highest Spirit Erasure stacks'], rows: [...se].sort((a, b) => b[1] - a[1]).map(([g, s]) => [{ p: pname(g) }, { txt: String(s), bad: s > 4 }]) });

  // ---- 7. Venomfang dispels ----
  const vf = auras('venomfang').filter((e) => h.isPlayer(e.dst));
  const vfRows = [];
  for (const a of vf.filter((e) => e.op === 'apply')) {
    const rem = vf.find((e) => e.op === 'remove' && e.dst === a.dst && e.t >= a.t);
    const disp = ev.find((e) => e.k === 'dispel' && L(e.spell) === 'venomfang' && e.dst === a.dst && e.t >= a.t && (!rem || e.t <= rem.t + 0.2));
    const took = rem ? rem.t - a.t : null;
    vfRows.push({ t: a.t, g: a.dst, took, by: disp ? disp.src : null });
  }
  const slow = vfRows.filter((x) => x.took != null && x.took > 4 && !x.by);
  sections.push({ id: 'vf', title: 'Venomfang dispels', spell: [0, 'Venomfang'],
    verdict: slow.length > 2 ? 'warn' : 'good',
    summary: pl(vfRows.length, 'Venomfang debuff') + ', ' + vfRows.filter((x) => x.by).length + ' dispelled. Average time on a player: ' +
      (vfRows.filter((x) => x.took != null).length ? (vfRows.filter((x) => x.took != null).reduce((s, x) => s + x.took, 0) / vfRows.filter((x) => x.took != null).length).toFixed(1) + 's' : 'n/a') + '.',
    cols: ['When', 'Player', 'Removed after', 'Dispelled by'], rows: vfRows.map((x) => [{ t: x.t }, { p: pname(x.g) }, { txt: x.took != null ? x.took.toFixed(1) + 's' : 'not removed', bad: x.took == null || x.took > 4 }, x.by ? { p: x.by } : { txt: 'expired / not dispelled', dim: true }]) });

  // ======== extra checks: pushes, cooldowns, Sever accounting, add execution, soak protection, mind controls, maps ========
  const LUST = ['bloodlust', 'heroism', 'time warp', 'fury of the aspects', 'primal rage', "harrier's cry"];
  const RAID_CD = ['darkness', 'spirit link totem', 'anti-magic zone', 'rallying cry', 'power word: barrier', 'aura mastery', 'tranquility', 'revival', 'rewind', 'divine hymn', 'vampiric embrace'];
  const IMMUNE = ['divine shield', 'ice block', 'aspect of the turtle', 'cloak of shadows', 'anti-magic shell', 'netherwalk', 'dispersion', 'blessing of spellwarding', 'blessing of protection'];
  const EXTERNAL = ['blessing of protection', 'blessing of spellwarding', 'blessing of sacrifice', 'pain suppression', 'guardian spirit', 'ironbark', 'life cocoon', 'time dilation'];
  const pcasts = (names) => ev.filter((e) => e.k === 'pcast' && names.includes(L(e.spell)));
  const guidsNamed = (re, not) => [...r.firstSeen.keys()].filter((g) => re.test(h.unitName(g) || '') && !(not && not.test(h.unitName(g) || '')));
  const zj = guidsNamed(/^Zul'jan$/), mal = guidsNamed(/Malacrass$/, /Fragment/);
  const zeroAt = (gs, after) => { let best = null; for (const g of gs) { const u = r.hpUnits && r.hpUnits.get(g); if (!u) continue; for (const [s, p] of u.samples) if (s >= (after || 0) && p <= 0.01) { if (best == null || s < best) best = s; break; } } return best; };
  const hpEnd = (gs) => { let v = null; for (const g of gs) { const u = r.hpUnits && r.hpUnits.get(g); if (u && u.samples.length) v = Math.round(100 * u.samples[u.samples.length - 1][1]); } return v; };
  // aura windows (immunities, externals, shields) per unit
  const win = new Map();
  for (const e of ev.filter((x) => x.k === 'aura')) {
    const n = L(e.spell), key = e.dst + '|' + n;
    if (e.op === 'apply') { let l = win.get(key); if (!l) win.set(key, l = []); l.push([e.t, Infinity]); }
    else if (e.op === 'remove') { const l = win.get(key); if (l && l.length && l[l.length - 1][1] === Infinity) l[l.length - 1][1] = e.t; }
  }
  const has = (g, n, t) => (win.get(g + '|' + n) || []).some(([a, b]) => t >= a - 0.3 && t <= b + 0.3);
  const fmtList = (es) => [...new Set(es.map((e) => e.spell + ' (' + pname(e.src) + ')'))].join(', ');
  const healPots = (a, b) => { const out = []; for (const p of r.players.values()) for (const x of p.cons.healpot.concat(p.cons.healthstone)) if (x.t >= a && x.t <= b) out.push(p.name); return out; };

  // ---- pushes and cooldowns ----
  const pushRows = [];

    const zjDmg = ev.filter((e) => e.k === 'pdmg' && e.t >= inter && e.t <= (p3 ?? dur) && zj.includes(e.dst)).reduce((s, e) => s + e.amt, 0);

  // ---- add execution: shield breaks and kick timing ----

  sc.forEach((t, i) => {

    for (const a of mine) {

        { txt: shOff ? 'broken at +' + (shOff.t - a.t0).toFixed(1) + 's' : mythic ? 'never broken' : '—', bad: mythic && !shOff },
        { txt: a.died != null ? 'died at ' + h.fmtT(a.died) : 'alive', bad: a.died == null }]);

  sections.push({ id: 'addx', title: 'Add execution: shields and kick timing', spell: S('spirit shield'), mythicOnly: true,

    cols: ['Set', 'Spawned', 'First kick', 'Spirit Shield', 'Died'], rows: addRows });

  // ---- Guillotine protection ----
  const qRows = [];
  const p1g = soaks.filter((s) => s.n === 'guillotine' && phaseAt(s.t) === 'P1');
  const grim = soaks.filter((s) => s.n === 'grim guillotine');

    const tag = (g) => { const im = IMMUNE.filter((n) => has(g, n, hit)), ex = EXTERNAL.filter((n) => has(g, n, hit)); return im.length ? 'immune: ' + im.join('/') : ex.length ? 'external: ' + ex.join('/') : role(g) === 'tank' ? 'tank' : ''; };
    const immunitySoak = mythic && ((s.n === 'guillotine' && p1g.indexOf(s) === 1) || (s.n === 'grim guillotine' && grim.indexOf(s) === 1));
    if (mythic && tgt && !tag(tgt)) M(s.t, pname(tgt), s.n, 'Medium', 'Was the ' + S(s.n)[1] + ' target with no external or immunity.', 'The target always gets Blessing of Protection (or Spellwarding on Grim Guillotine 2) or a strong external.');

      { txt: tgt ? (tag(tgt) || 'no protection') : '—', bad: !!tgt && !tag(tgt) },
      { txt: s.who.map((g) => pname(g) + (tag(g) ? ' [' + tag(g) + ']' : '')).join(', ') || '—', dim: true }, { map: { t: hit, hl: s.who.concat(tgt ? [tgt] : []), title: S(s.n)[1] + ' soak at ' + h.fmtT(hit) } }]);
  }
  sections.push({ id: 'soakq', title: 'Guillotine protection', spell: S('grim guillotine'),

    cols: ['When', 'Soak', 'Plan', 'Target', 'Target protection', 'Soakers', ''], rows: qRows });

  // ---- mind controls: deaths by falling in P2/P3 ----
  const mcRows = [];
  for (const d of r.deaths) {
    const ph = phaseAt(d.t); if (ph !== 'P2' && ph !== 'P3') continue;
    const lastHit = d.recap.filter((x) => !x.heal).pop();
    const fell = lastHit && /fall/i.test(lastHit.spell);

    if (fell || noHit) {
      M(d.t, d.player, 'dreadmarch', 'High', 'Died ' + (fell ? 'from falling' : 'with no damage in the seconds before') + ' in ' + ph + ', most likely mind controlled off the platform.', 'Cancel shields and absorbs when mind controlled, and keep a stun plus a grip or ring ready for every Dreadmarch.');
      mcRows.push([{ t: d.t }, { p: d.player }, { txt: ph }, { txt: fell ? 'falling damage' : 'no damage before death', dim: true }, { map: { t: d.t - 1, hl: [d.guid], title: d.player + ' just before dying' } }]);

  sections.push({ id: 'mc', title: 'Mind controls (falls)', spell: S('dreadmarch'), mythicOnly: false,
    verdict: mcRows.length ? 'bad' : 'good',
    summary: 'Deaths in P2 and P3 from falling, or with no damage taken just before, which on this fight almost always means a Dreadmarch mind control walked someone off the edge.',
    cols: ['When', 'Player', 'Phase', 'How', ''], rows: mcRows });

  // ---- maps on existing sections ----
  for (const s of sections) {
    if (s.id === 'ghosts') s.rows.forEach((row, i) => row.push({ map: { t: mrEvents[i].t, hl: [...mrEvents[i].who], title: 'Ghost collision at ' + h.fmtT(mrEvents[i].t) } }));
    if (s.id === 'orbs') { s.collisions = bursts.map((b) => ({ map: { t: b.t, hl: carriersAt(b.t).map((c) => c.g), title: 'Orb collision at ' + h.fmtT(b.t) + ' (carriers ringed)' } })); }
  }
  const orbSec = sections.find((s) => s.id === 'orbs');
  if (orbSec && bursts.length) { orbSec.cols = orbSec.cols.concat(['']); orbSec.rows = orbSec.rows.map((row, i) => row.concat([(() => { const d0 = deluges[i], d1 = deluges[i + 1] ?? (p2 ?? dur); const b = bursts.find((x) => x.t >= d0 && x.t < d1); return b ? { map: { t: b.t, hl: carriersAt(b.t).map((c) => c.g), title: 'Orb collision at ' + h.fmtT(b.t) + ' (purple carriers ringed)' } } : { txt: '' }; })()])); }

  const order = ['push', 'front', 'orbs', 'sever', 'soaks', 'soakq', 'ghosts', 'mc', 'adds', 'addx', 'inter', 'vf'];
  sections.sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));

// ---------- mechanics ----------
// Rule types: avoidable, debuff, interrupt, bossBuff, stacks, raidFail.
// Rules match by spellIds and/or names (names used when no spell ID is published yet).
class Mech {
  constructor(item, packs) {
    const T = ['avoidable', 'debuff', 'interrupt', 'bossbuff', 'stacks', 'raidfail'];
    this.ids = {}; this.names = {};
    for (const k of T) { this.ids[k] = new Map(); this.names[k] = new Map(); }
    this.avoid = new Map(); this.debuffs = new Map(); this.stk = new Map(); this.raid = []; this.fails = new Map(); this.casts = [];
    const names = new Set(item.kind === 'run' ? item.bosses.map((b) => b.boss) : [item.boss]);
    const diff = item.kind === 'run' ? 'Mythic' : item.diff;
    this.packs = packs.filter((p) => names.has(p.encounter) || (p.aliases || []).some((a) => names.has(a)));
    for (const p of this.packs) for (const r of p.rules) {
      if (r.difficulties && r.difficulties.length && !r.difficulties.includes(diff)) continue;
      const k = String(r.type).toLowerCase(); if (!this.ids[k]) continue;
      for (const id of r.spellIds || []) this.ids[k].set(+id, r);
      for (const n of r.names || [r.name]) this.names[k].set(String(n).toLowerCase(), r);
    }
  }
  get(k, id, name) { return this.ids[k].get(id) || (name ? this.names[k].get(name.toLowerCase()) : undefined); }
  damage(t, player, id, name, amount) {
    const f = this.get('raidfail', id, name);
    if (f) {
      let list = this.fails.get(f.name); if (!list) this.fails.set(f.name, list = []);
      const last = list[list.length - 1];
      if (last && t - last.t <= 4) { last.hit.add(player); last.dmg += amount; } else list.push({ t, r: f, id, hit: new Set([player]), dmg: amount });
    }
    const r = this.get('avoidable', id, name); if (!r) return 0;
    const k = player + '\u0001' + r.name, a = this.avoid.get(k);
    if (a) { a.hits++; a.dmg += amount; } else this.avoid.set(k, { p: player, r, hits: 1, dmg: amount, t, id });
    return amount;
  }
  aura(t, target, isPl, id, name, stacks) {
    let r;
    if (isPl && stacks <= 1 && (r = this.get('debuff', id, name))) {
      const k = target + '\u0001' + r.name, a = this.debuffs.get(k);
      if (a) a.n++; else this.debuffs.set(k, { p: target, r, n: 1, t, id });
    }
    if (isPl && (r = this.get('stacks', id, name))) {
      const k = target + '\u0001' + r.name, a = this.stk.get(k);
      if (!a || stacks > a.max) this.stk.set(k, { p: target, r, max: stacks, t, id });
    }
    if (!isPl && (r = this.get('bossbuff', id, name)) && !this.raid.some((m) => m.mechanic === r.name && t - m.t < 5))
      this.raid.push({ t, player: 'Raid', mechanic: r.name, id, severity: r.severity, detail: target + ' gained ' + r.name + '.', fix: r.tip });
  }
  npcCast(t, caster, guid, id, name) {
    const r = this.get('interrupt', id, name);
    if (r) this.casts.push({ t, caster, guid, id, name: (name || '').toLowerCase(), r, kicked: false });
  }
  interrupted(t, guid, id, name) {
    const ln = (name || '').toLowerCase();
    for (let i = this.casts.length - 1; i >= 0; i--) {
      const c = this.casts[i];
      if (t - c.t > 12) break;
      if (!c.kicked && c.guid === guid && (c.id === id || c.name === ln)) { c.kicked = true; return; }
    }
  }
  build() {
    const out = this.raid.slice();
    for (const c of this.casts) if (!c.kicked) out.push({ t: c.t, player: 'Raid', mechanic: c.r.name, id: c.id, severity: c.r.severity, detail: c.caster + ' got ' + c.r.name + ' off. Nobody interrupted it.', fix: c.r.tip });
    for (const list of this.fails.values()) for (const f of list) out.push({ t: f.t, player: 'Raid', mechanic: f.r.name, id: f.id, severity: f.r.severity,
      detail: f.r.name + ' went off and hit ' + f.hit.size + (f.hit.size === 1 ? ' player' : ' players') + ' for ' + Math.round(f.dmg).toLocaleString('en-US') + '.', fix: f.r.tip });
    for (const a of this.avoid.values()) out.push({ t: a.t, player: a.p, mechanic: a.r.name, id: a.id, severity: a.r.severity, dmg: a.dmg,
      detail: 'Hit ' + a.hits + 'x for ' + Math.round(a.dmg).toLocaleString('en-US') + ' avoidable damage.', fix: a.r.tip });
    for (const a of this.debuffs.values()) out.push({ t: a.t, player: a.p, mechanic: a.r.name, id: a.id, severity: a.r.severity,
      detail: 'Got ' + a.r.name + ' ' + a.n + 'x.', fix: a.r.tip });
    for (const a of this.stk.values()) if (a.max > a.r.threshold) out.push({ t: a.t, player: a.p, mechanic: a.r.name, id: a.id, severity: a.r.severity,
      detail: 'Reached ' + a.max + ' stacks (aim to stay at or under ' + a.r.threshold + ').', fix: a.r.tip });
    return out;
  }
}

// ---------- analysis of one pull or key ----------
function newPlayer(guid) {
  return { guid, name: '', specId: 0, cls: null, damage: 0, healing: 0, overheal: 0, absorbs: 0, taken: 0, avoidable: 0,
    casts: 0, interrupts: 0, dispels: 0, deaths: 0, active: 0, lastCast: -1,
    dmgAb: new Map(), healAb: new Map(), takenAb: new Map(), castAb: new Map(), castTimes: new Map(), byName: new Map(),
    cons: { healthstone: [], healpot: [], combatpot: [], manapot: [], utilpot: [] } };
}
function addAb(m, name, id, amt, over, crit) {
  let a = m.get(name);
  if (!a) m.set(name, a = { name, id, total: 0, over: 0, hits: 0, crits: 0 });
  a.total += amt; a.over += over; a.hits++; if (crit) a.crits++;
}
function bump(arr, t, v) { const i = t | 0; while (arr.length <= i) arr.push(0); arr[i] += v; }

function analyze(item, text, opts) {
  const packs = (opts && opts.packs) || PACKS;
  const r = { item, players: new Map(), deaths: [], mistakes: [], insights: [], interrupts: [],
    dmgS: [], healS: [], takenS: [], bossS: [], bossPct: null, duration: 0 };
  const pets = new Map(), recaps = new Map(), mech = new Mech(item, packs);
  const hits = new Map(), stackEv = [], npcCasts = [];
  const mod = item.kind === 'boss' ? MODULES.find((m) => m.encounter === item.boss) : null;
  const watch = mod ? new Set(mod.spells) : null, modEv = [];
  const W = (name) => watch && watch.has(String(name).toLowerCase());
  // Unit positions from the advanced-logging block (x/y in world yards), kept at most every 0.5s per unit.
  const positions = new Map();
  const pos = (g, n, x, y, t) => {
    x = +x; y = +y; if (!g || !(x || y) || x !== x || y !== y) return;
    let u = positions.get(g); if (!u) positions.set(g, u = { guid: g, name: n, pts: [] });
    if (n && !u.name) u.name = n;
    const last = u.pts[u.pts.length - 1];
    if (!last || t - last[0] >= 0.5) u.pts.push([t, x, y]);
  };
  r.positions = positions;
  // When each enemy first appears (for grouping adds into spawn waves) and its raid markers over time.
  const firstSeen = new Map(), marks = new Map();
  const unitNames = new Map();
  const seen = (g, t, n) => { if (g && (g.startsWith('Creature-') || g.startsWith('Vehicle-'))) { if (!firstSeen.has(g)) firstSeen.set(g, t); if (n && !unitNames.has(g)) unitNames.set(g, n); } };
  const mark = (g, flags, t) => {
    const v = parseInt(flags, 16) & 0xff; if (!v || !g || isPlayer(g)) return;
    let idx = 0; while (!((v >> idx) & 1)) idx++;
    let l = marks.get(g); if (!l) marks.set(g, l = []);
    if (!l.length || l[l.length - 1][1] !== idx + 1) l.push([t, idx + 1]);
  };
  r.firstSeen = firstSeen; r.marks = marks;
  const hit = (g, t, spell, id) => { let l = hits.get(g); if (!l) hits.set(g, l = []); l.push({ t, spell, id }); };
  const bossNames = new Set(item.kind === 'run' ? item.bosses.map((b) => b.boss) : [item.boss]);
  const P = (g, n) => { let p = r.players.get(g); if (!p) r.players.set(g, p = newPlayer(g)); if (n && !p.name) p.name = shortName(g, n); return p; };
  const recap = (g, e) => { let l = recaps.get(g); if (!l) recaps.set(g, l = []); l.push(e); if (l.length > 16) l.shift(); };
  let lastT = 0;
  const units = new Map(); // enemy health from advanced logging: guid -> { name, max, cur, samples }
  const seenHp = (g, n, cur, mx, t) => {
    if (!(mx > 0) || isPlayer(g) || !(g.startsWith('Creature-') || g.startsWith('Vehicle-'))) return;
    let u = units.get(g); if (!u) units.set(g, u = { name: n, max: mx, cur, samples: [] });
    u.max = Math.max(u.max, mx); const pct = Math.min(1, cur / mx);
    const s = t | 0, last = u.samples[u.samples.length - 1];
    if (last && last[0] === s) last[1] = pct; else u.samples.push([s, pct]);
  };

  const lines = text.split('\n');
  for (let li = 0; li < lines.length; li++) {
    let line = lines[li];
    if (!line) continue;
    if (line.charCodeAt(line.length - 1) === 13) line = line.slice(0, -1);
    const ts = parseTs(line); if (!ts) continue;
    const t = Math.max(0, (ts.ms - item.startMs) / 1000); lastT = t;
    const c = line.indexOf(',', ts.body); if (c < 0) continue;
    const ev = line.substring(ts.body, c);
    if (!WANTED.has(ev)) continue;
    const f = split(line, c + 1);

    if (ev === 'COMBATANT_INFO') {
      if (f.length > 24) { let s = num(f[24]); if (!SPECS[s]) s = num(f[23]); if (SPECS[s]) P(f[0]).specId = s; }
      continue;
    }
    if (f.length < 8) continue;
    const sg = f[0], sn = f[1], dg = f[4], dn = f[5];
    seen(sg, t, sn); seen(dg, t, dn); mark(sg, f[3], t); mark(dg, f[7], t);

    if (ev === 'SPELL_SUMMON') { if (isPlayer(sg)) pets.set(dg, sg); continue; }
    if (ev === 'UNIT_DIED') {
      if (!isPlayer(dg)) { const u = units.get(dg); if (u) u.samples.push([t | 0, 0]); if (mod) modEv.push({ k: 'die', t, guid: dg, name: dn }); continue; }
      if (f[8] === '1') continue;
      const p = P(dg, dn); p.deaths++;
      const recent = (recaps.get(dg) || []).filter((e) => e.t >= t - 10);
      let last = null; for (const e of recent) if (!e.heal) last = e;
      r.deaths.push({ t, guid: dg, player: p.name, killer: last ? last.src : 'Unknown', ability: last ? last.spell : '', abilityId: last ? last.id : 0, recap: recent });
      continue;
    }

    const owner = isPlayer(sg) ? sg : (pets.get(sg) || '');
    const pet = owner && !isPlayer(sg);

    switch (ev) {
      case 'SPELL_DAMAGE': case 'SPELL_PERIODIC_DAMAGE': case 'RANGE_DAMAGE': case 'SWING_DAMAGE': {
        const swing = ev === 'SWING_DAMAGE', adv = swing ? 8 : 11;
        if (f.length < adv + 8) break;
        const hasAdv = f.length >= adv + ADV + 8, s0 = adv + (hasAdv ? ADV : 0);
        if (swing && hasAdv && !owner && f[adv] === sg && isPlayer(f[adv + 1])) pets.set(sg, f[adv + 1]);
        const base = num(f[s0]), over = Math.max(0, num(f[s0 + 2]));
        const dealt = Math.max(0, base + num(f[s0 + 4]) + num(f[s0 + 5]) - over);
        const crit = f[s0 + 7] === '1';
        const id = swing ? 6603 : num(f[8]), spell = swing ? 'Melee' : f[9];
        if (!swing) noteSchool(id, f[10]); else SCHOOL.set(6603, 1);
        let hp = -1;
        if (hasAdv) pos(f[adv], f[adv] === dg ? dn : f[adv] === sg ? sn : '', f[adv + PX], f[adv + PX + 1], t);
        if (hasAdv && f[adv] === dg) { const mx = num(f[adv + 3]); if (mx > 0) { hp = num(f[adv + 2]) / mx * 100; seenHp(dg, dn, num(f[adv + 2]), mx, t); } }
        if (isPlayer(dg)) {
          const p = P(dg, dn);
          p.taken += base; addAb(p.takenAb, spell, id, base, 0, crit); bump(r.takenS, t, base);
          p.avoidable += mech.damage(t, p.name, id, spell, base);
          if (!owner) hit(dg, t, spell, id);
          if (W(spell)) modEv.push({ k: 'dmg', t, dst: dg, spell, amt: base, src: sg, srcName: sn });
          recap(dg, { t, heal: false, amount: base, src: shortName(sg, sn), spell, id, hp });
        } else if (owner) {
          const p = P(owner, pet ? null : sn);
          p.damage += dealt;
          if (mod && mod.focus && mod.focus.has(dn)) modEv.push({ k: 'pdmg', t, src: owner, dst: dg, amt: dealt }); addAb(p.dmgAb, pet ? sn + ': ' + spell : spell, id, dealt, 0, crit); bump(r.dmgS, t, dealt);
        }
        break;
      }
      case 'ENVIRONMENTAL_DAMAGE': {
        if (!isPlayer(dg) || f.length < 31) break;
        const base = num(f[28]), p = P(dg, dn);
        p.taken += base; addAb(p.takenAb, f[27], 0, base, 0, false); bump(r.takenS, t, base);
        recap(dg, { t, heal: false, amount: base, src: 'Environment', spell: f[27], id: 0, hp: -1 });
        break;
      }
      case 'SPELL_HEAL': case 'SPELL_PERIODIC_HEAL': {
        if (f.length < 16) break;
        const s0 = 11 + (f.length >= 11 + ADV + 5 ? ADV : 0);
        if (s0 > 11) pos(f[11], f[11] === dg ? dn : f[11] === sg ? sn : '', f[11 + PX], f[12 + PX], t);
        const amount = num(f[s0 + 1]), over = Math.max(0, num(f[s0 + 2])), crit = f[s0 + 4] === '1';
        const eff = Math.max(0, amount - over), id = num(f[8]), spell = f[9];
        noteSchool(id, f[10]);
        if (owner) {
          const p = P(owner, pet ? null : sn);
          p.healing += eff; p.overheal += over; addAb(p.healAb, pet ? sn + ': ' + spell : spell, id, eff, over, crit); bump(r.healS, t, eff);
          if (/healthstone/i.test(spell) && !p.cons.healthstone.some((x) => Math.abs(x.t - t) < 2)) p.cons.healthstone.push({ t, name: spell, id });
        }
        if (isPlayer(dg) && eff > 0) recap(dg, { t, heal: true, amount: eff, src: shortName(sg, sn), spell, id, hp: -1 });
        if (!owner && W(spell)) modEv.push({ k: 'heal', t, src: sg, srcName: sn, dst: dg, spell, amt: amount });
        break;
      }
      case 'SPELL_ABSORBED': {
        const a = f.length >= 21 ? 11 : 8, sp = a + 4;
        if (f.length < sp + 4) break;
        const absorber = f[a], id = num(f[sp]), amt = num(f[sp + 3]);
        noteSchool(id, f[sp + 2]);
        if (amt <= 0 || NOT_HEALING.has(id)) break;
        const ow = isPlayer(absorber) ? absorber : pets.get(absorber);
        if (!ow) break;
        const p = P(ow, isPlayer(absorber) ? f[a + 1] : null);
        p.healing += amt; p.absorbs += amt; addAb(p.healAb, f[sp + 1], id, amt, 0, false); bump(r.healS, t, amt);
        if (isPlayer(dg)) recap(dg, { t, heal: true, amount: amt, src: shortName(absorber, f[a + 1]), spell: f[sp + 1] + ' (absorb)', id, hp: -1 });
        break;
      }
      case 'SPELL_AURA_APPLIED': case 'SPELL_AURA_APPLIED_DOSE': {
        if (f.length < 12) break;
        noteSchool(num(f[8]), f[10]);
        const stacks = ev === 'SPELL_AURA_APPLIED_DOSE' && f.length > 12 ? num(f[12]) : 1;
        const pl = isPlayer(dg);
        mech.aura(t, pl ? P(dg, dn).name : dn, pl, num(f[8]), f[9], stacks);
        if (W(f[9])) modEv.push({ k: 'aura', op: ev === 'SPELL_AURA_APPLIED' ? 'apply' : 'dose', t, dst: dg, spell: f[9], stacks, src: sg });
        if (pl) { const sr = mech.get('stacks', num(f[8]), f[9]); if (sr) stackEv.push({ t, guid: dg, rule: sr, stacks, up: true, id: num(f[8]) }); }
        break;
      }
      case 'SPELL_AURA_REMOVED':
        if (f.length >= 10 && W(f[9])) modEv.push({ k: 'aura', op: 'remove', t, dst: dg, spell: f[9], stacks: 0, src: sg });
        break;
      case 'SPELL_CAST_START':
        if (f.length >= 10 && !isPlayer(sg) && W(f[9])) modEv.push({ k: 'start', t, src: sg, srcName: sn, spell: f[9] });
        break;
      case 'SPELL_AURA_REMOVED_DOSE': {
        if (f.length >= 13 && W(f[9])) modEv.push({ k: 'aura', op: 'rdose', t, dst: dg, spell: f[9], stacks: num(f[12]), src: sg });
        if (f.length < 13 || !isPlayer(dg)) break;
        const sr = mech.get('stacks', num(f[8]), f[9]);
        if (sr) stackEv.push({ t, guid: dg, rule: sr, stacks: num(f[12]), up: false, id: num(f[8]) });
        break;
      }
      case 'SPELL_CAST_SUCCESS': {
        if (f.length < 10) break;
        const id = num(f[8]), spell = f[9];
        noteSchool(id, f[10]);
        if (f.length >= 11 + ADV && f[11] === sg) pos(sg, sn, f[11 + PX], f[12 + PX], t);
        if (f.length >= 11 + ADV && f[11] === sg && isPlayer(f[12]) && !isPlayer(sg)) pets.set(sg, f[12]);
        if (!isPlayer(sg) && f.length >= 11 + ADV && f[11] === sg) seenHp(sg, sn, num(f[13]), num(f[14]), t);
        if (!isPlayer(sg)) { if (!owner) { mech.npcCast(t, sn, sg, id, spell); npcCasts.push({ t, guid: sg, caster: sn, id, spell }); if (W(spell)) modEv.push({ k: 'cast', t, src: sg, srcName: sn, spell }); } break; }
        const p = P(sg, sn);
        p.casts++;
        if (W(spell)) modEv.push({ k: 'pcast', t, src: sg, spell });
        const ca = p.castAb.get(spell); if (ca) ca.n++; else p.castAb.set(spell, { name: spell, id, n: 1 });
        let tl = p.castTimes.get(id); if (!tl) p.castTimes.set(id, tl = []); tl.push(t);
        const ln = spell.toLowerCase();
        let bl = p.byName.get(ln); if (!bl) p.byName.set(ln, bl = []); bl.push(t);
        if (ln.includes('healthstone')) { if (!p.cons.healthstone.some((x) => Math.abs(x.t - t) < 2)) p.cons.healthstone.push({ t, name: spell, id }); }
        else { const k = potionKind(ln); if (k) p.cons[k].push({ t, name: spell, id }); }
        if (p.lastCast >= 0) p.active += Math.min(t - p.lastCast, 2.5);
        p.lastCast = t;
        break;
      }
      case 'SPELL_INTERRUPT':
        if (f.length > 12) mech.interrupted(t, dg, num(f[11]), f[12]);
        if (owner && f.length > 12) { const p = P(owner, pet ? null : sn); p.interrupts++; r.interrupts.push({ t, player: p.name, guid: owner, target: dg, marker: (() => { const v = parseInt(f[7], 16) & 0xff; let i = 0; if (!v) return 0; while (!((v >> i) & 1)) i++; return i + 1; })(), caster: dn, spell: f[12], id: num(f[11]), by: f[9], byId: num(f[8]) }); }
        break;
      case 'SPELL_DISPEL':
        if (owner) P(owner, pet ? null : sn).dispels++;
        if (owner && f.length > 12 && W(f[12])) modEv.push({ k: 'dispel', t, src: P(owner).name, dst: dg, spell: f[12] });
        break;
    }
  }

  r.duration = Math.max(1, item.duration > 0 ? item.duration : lastT);
  // Boss units: enemies named like the encounter; otherwise (councils like The Twin Fangs) the
  // biggest-health enemies, i.e. everything within half the health pool of the largest one.
  let bossUnits = [...units.values()].filter((u) => bossNames.has(u.name));
  if (!bossUnits.length && units.size) {
    const top = Math.max(...[...units.values()].map((u) => u.max));
    bossUnits = [...units.values()].filter((u) => u.max >= top * 0.5);
  }
  r.bossUnits = [...new Set(bossUnits.map((u) => u.name))];
  r.hpUnits = units;
  if (bossUnits.length && item.kind === 'boss') {
    const n = Math.ceil(r.duration) + 1, cur = bossUnits.map(() => 1), idx = bossUnits.map(() => 0);
    const total = bossUnits.reduce((s, u) => s + u.max, 0);
    for (let s = 0; s < n; s++) {
      bossUnits.forEach((u, k) => { while (idx[k] < u.samples.length && u.samples[idx[k]][0] <= s) cur[k] = u.samples[idx[k]++][1]; });
      r.bossS.push(100 * bossUnits.reduce((a, u, k) => a + cur[k] * u.max, 0) / total);
    }
    r.bossPct = item.kill ? 0 : r.bossS[r.bossS.length - 1];
  } else r.bossPct = item.kind === 'boss' && item.kill ? 0 : null;
  for (const [g, p] of r.players) {
    if (p.damage + p.healing + p.casts + p.taken + p.interrupts + p.absorbs === 0 && !p.deaths && !p.specId) { r.players.delete(g); continue; }
    if (!p.name) p.name = g;
    const sp = SPECS[p.specId];
    p.cls = sp ? sp[1] : null;
    p.specName = sp ? sp[0] + ' ' + CLASSES[sp[1]][0] : 'Unknown spec';
    p.role = TANKS.has(p.specId) ? 'tank' : HEALERS.has(p.specId) ? 'healer' : (p.specId ? 'dps' : (p.healing > p.damage ? 'healer' : 'dps'));
    p.color = p.cls ? CLASSES[p.cls][1] : '#9aa0ac';
    p.icon = p.cls ? CLASSES[p.cls][2] : null;
    const firstDeath = r.deaths.filter((d) => d.guid === g).map((d) => d.t);
    p.aliveUntil = Math.max(1, firstDeath.length ? Math.min(...firstDeath) : r.duration);
  }
  for (const d of r.deaths) { const p = r.players.get(d.guid); d.color = p ? p.color : '#9aa0ac'; d.icon = p && p.icon; d.spec = p ? p.specName : ''; }

  survivability(r);
  r.mistakes = mech.build();
  kickReport(r, npcCasts, mech);
  stackReport(r, stackEv, hits, (opts && opts.overrides) || {});
  r.mistakes.sort((a, b) => a.t - b.t);
  for (const d of r.deaths) {
    const p = r.players.get(d.guid);
    r.mistakes.push({ t: d.t, player: d.player, mechanic: 'Death', id: d.abilityId, severity: 'High',
      detail: 'Died to ' + d.killer + (d.ability ? ': ' + d.ability : '') + '.',
      fix: d.available && d.available.length ? 'Still had ' + (d.available.length < 2 ? d.available[0] : d.available.slice(0, -1).join(', ') + ' and ' + d.available[d.available.length - 1]) + ' available.' : 'Check the death recap for what led up to it.' });
    if (p && d.available && d.available.length) p.diedWithDefs = (p.diedWithDefs || 0) + 1;
  }
  r.mistakes.sort((a, b) => a.t - b.t);
  if (mod) {
    const helpers = { name: (g) => (r.players.get(g) || {}).name || g, role: (g) => (r.players.get(g) || {}).role, isPlayer, fmtT, unitName: (g) => unitNames.get(g), compact,
      snap: (t) => { const out = []; for (const u of r.positions.values()) { let best = null; for (const p of u.pts) { if (p[0] > t + 0.5) break; if (p[0] >= t - 3) best = p; } if (!best) continue; const pl = r.players.get(u.guid); if (pl) out.push({ guid: u.guid, name: pl.name, x: best[1], y: best[2], kind: 'player' }); else if (mod.focus.has(unitNames.get(u.guid))) out.push({ guid: u.guid, name: unitNames.get(u.guid), x: best[1], y: best[2], kind: 'boss' }); } return out; } };
    try { r.module = mod.build(modEv, r, helpers); r.mistakes.push(...r.module.mistakes); r.mistakes.sort((a, b) => a.t - b.t); }
    catch (err) { r.module = { title: mod.encounter + ' audit', error: String(err && err.message || err), sections: [], phases: [], marks: [] }; }
  }
  r.hasPack = mech.packs.length > 0;
  r.packSources = mech.packs.flatMap((p) => p.sources).join('; ');
  insights(r);
  return r;
}

// Interrupts: a spell counts as kickable if anyone kicked it this pull or a rule says so.
// A completed cast of a kickable spell with no kick on that caster within 12s counts as "got off".
function kickReport(r, casts, mech) {
  const byKey = new Map();
  const key = (id, name) => id || ('n:' + String(name).toLowerCase());
  const row = (id, name) => { const k = key(id, name); let x = byKey.get(k); if (!x) byKey.set(k, x = { id, name, kicked: 0, missed: 0, kickers: new Map(), missedAt: [] }); return x; };
  for (const k of r.interrupts) { const x = row(k.id, k.spell); x.kicked++; x.kickers.set(k.player, (x.kickers.get(k.player) || 0) + 1); }
  const ruleNames = new Set([...mech.names.interrupt.keys()]), ruleIds = new Set([...mech.ids.interrupt.keys()]);
  for (const c of casts) {
    const kickable = byKey.has(key(c.id, c.spell)) || ruleIds.has(c.id) || ruleNames.has(String(c.spell).toLowerCase());
    if (!kickable) continue;
    const kicked = r.interrupts.some((k) => k.target === c.guid && k.t >= c.t && k.t - c.t <= 12 && (k.id === c.id || k.spell === c.spell));
    if (!kicked) { const x = row(c.id, c.spell); x.missed++; x.missedAt.push({ t: c.t, caster: c.caster, guid: c.guid }); }
  }
  r.kicks = [...byKey.values()].sort((a, b) => (b.kicked + b.missed) - (a.kicked + a.missed));
  // Per enemy unit: number adds of the same name in the order they first act ("Spawn of Vexhul #2"),
  // so a missed cast can be traced to the exact add and to who had been kicking it.
  const missed = [];
  for (const x of r.kicks) for (const m of x.missedAt) missed.push({ t: m.t, guid: m.guid, caster: m.caster, spell: x.name, id: x.id });
  const evs = r.interrupts.map((k) => ({ t: k.t, guid: k.target, name: k.caster, kick: k }))
    .concat(missed.map((m) => ({ t: m.t, guid: m.guid, name: m.caster, miss: m }))).sort((a, b) => a.t - b.t);
  const units = new Map();
  for (const ev of evs) {
    let u = units.get(ev.guid);
    if (!u) units.set(ev.guid, u = { guid: ev.guid, name: ev.name, kicked: [], missed: [], spawn: r.firstSeen.has(ev.guid) ? r.firstSeen.get(ev.guid) : ev.t });
    if (ev.kick) u.kicked.push(ev.kick); else u.missed.push(ev.miss);
  }
  // Group same-name adds into sets (appearing within 8s of the previous one = same set),
  // and number them within their set, so the 3rd add of set 4 reads "Set 4 #3", not "#12".
  const byName = new Map();
  for (const u of units.values()) { if (!byName.has(u.name)) byName.set(u.name, []); byName.get(u.name).push(u); }
  for (const list of byName.values()) {
    list.sort((a, b) => a.spawn - b.spawn);
    let w = 0, n = 0, prev = -1e9;
    for (const u of list) { if (u.spawn - prev > 8) { w++; n = 0; } prev = u.spawn; u.wave = w; u.n = ++n; }
    const waves = w;
    for (const u of list) {
      const size = list.filter((x) => x.wave === u.wave).length;
      u.short = (waves > 1 ? 'Set ' + u.wave + (size > 1 ? ' #' + u.n : '') : list.length > 1 ? '#' + u.n : '');
      u.label = u.name + (u.short ? ' (' + u.short + ')' : '');
      u.marker = markerAt(r, u.guid, Math.max(...u.kicked.map((k) => k.t), ...u.missed.map((x) => x.t)));
    }
  }
  r.kickUnits = [...units.values()].sort((a, b) => b.missed.length - a.missed.length || a.name.localeCompare(b.name) || a.n - b.n);
  r.missedKicks = missed.sort((a, b) => a.t - b.t).map((m) => {
    const u = units.get(m.guid);
    const snap = snapshot(r, m.t, units);
    // Always show the two adds that most recently cast before this one (kicked or not),
    // at their last known spot even if that is older than 3s (they may have died).
    const recent = [...units.values()].filter((o) => o.guid !== m.guid)
      .map((o) => ({ o, last: Math.max(-1, ...o.kicked.filter((k) => k.t <= m.t).map((k) => k.t), ...o.missed.filter((x) => x.t <= m.t).map((x) => x.t)) }))
      .filter((x) => x.last >= 0).sort((a, b) => b.last - a.last).slice(0, 2);
    for (const { o, last } of recent) {
      const have = snap.find((p) => p.guid === o.guid);
      if (have) { have.recent = true; have.lastCast = last; continue; }
      const pu = r.positions.get(o.guid); if (!pu) continue;
      let best = null; for (const p of pu.pts) { if (p[0] > m.t + 0.5) break; best = p; }
      if (best) snap.push({ guid: o.guid, name: o.label, short: o.short, x: best[1], y: best[2], kind: 'add', recent: true, stale: m.t - best[0], lastCast: last, marker: markerAt(r, o.guid, m.t), hp: hpAt(r, o.guid, m.t) });
    }
    return { ...m, label: u.label, short: u.short, wave: u.wave, marker: markerAt(r, m.guid, m.t), before: u.kicked.filter((k) => k.t < m.t), after: u.kicked.filter((k) => k.t > m.t), snap };
  });
}

// Debuff stack sources: each stack gain is credited to the closest hit on that player
// (up to 1s before or 0.25s after), then sorted into the rule's source groups.

      r.bosses.forEach((b, i) => { h += '<button class="pull" data-i="' + add(b) + '"><span class="n">' + (i + 1) + '</span><span>' + esc(b.boss) + '</span>' + resChip(b) + '<span class="d">' + T(b.duration) + '</span></button>'; });

}

async function getRep(item) {
  if (CACHE.has(item)) return CACHE.get(item);
  let text;
  if (item.wcl) {
    const st = () => document.getElementById('loadmsg');
    const events = await WCL.loadEvents(S.wclCreds, item, (pg, n) => { if (st()) st().textContent = 'Downloading ' + item.boss + ' pull ' + item.pull + ' from Warcraft Logs: ' + n.toLocaleString('en-US') + ' events…'; });
    text = WCL.translate(item, events);
  } else text = await S.file.slice(item.startByte, item.endByte).text();
  const rep = E.analyze(item, text, { packs: S.packs, overrides: overrides() });
  CACHE.set(item, rep);
  return rep;
}
async function select(item) {
  S.miss = 0; syncUrl(item);
  S.item = item; S.mPlayer = null; S.pPlayer = null; S.death = 0;
  document.querySelectorAll('.pull').forEach((b) => b.classList.toggle('sel', ITEMS[+b.dataset.i] === item));
  $('#main').innerHTML = '<div class="empty"><p class="muted" id="loadmsg">Analyzing ' + esc(item.boss) + '…</p></div>';
  let rep;
  try { rep = await getRep(item); }
  catch (err) { $('#main').innerHTML = '<div class="empty"><p class="muted">Couldn\'t analyze this pull: ' + esc(err.message) + '</p></div>'; console.error(err); return; }
  if (S.item !== item) return;
  try { S.rep = rep; }
  catch (err) { $('#main').innerHTML = '<div class="empty"><p class="muted">Couldn\'t analyze this pull: ' + esc(err.message) + '</p></div>'; console.error(err); return; }
  renderMain();
}

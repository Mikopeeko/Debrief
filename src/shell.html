<style>

}
* { box-sizing: border-box; }

.app { display: grid; grid-template-columns: 290px 1fr; height: 100vh; }

.rcn-kick { font:600 11px var(--head); letter-spacing:.16em; text-transform:uppercase; color:var(--gold); }
.rcn-h { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; font:700 23px var(--head); margin:0 0 12px; } .rcn-h small { font:400 14px var(--body); color:var(--muted); }

.rcn-pp { padding:0; overflow:hidden; } .rcn-scroll { overflow-x:auto; }
.rcn-med { display:inline-grid; place-items:center; width:34px; height:34px; border-radius:50%; font:700 15px var(--head); color:#1b1406; flex:none; box-shadow:inset 0 -3px 0 rgba(0,0,0,.25), 0 2px 10px rgba(0,0,0,.35); }

.rcn-dl { font:600 11.5px var(--body); margin-left:4px; }

.rcn-head h2 { font:700 32px/1.1 var(--head); margin:2px 0 0; } .rcn-head p { margin:6px 0 0; color:#d9d4c8; }

.rcn-av .av, .rcn-av img { width:76px !important; height:76px !important; border-radius:18px; } .rcn-spot h3 { font:700 32px/1 var(--head); color:var(--c); margin:4px 0 2px; } .rcn-spot p { margin:8px 0 0; font-size:13.5px; color:#d9d4c8; }
